    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div><h3>Пополнение баланса</h3><p>Оплата через @CryptoBot</p></div>
      <button class="close" data-close>${I.close}</button>
    </div>
    <div class="amount-grid">
      ${TOPUP_PRESETS.map(a => `<button class="amount ${state.deposit === a ? 'on' : ''}" data-amount="${a}">${num(a)}<small>GRAM</small></button>`).join('')}
    </div>
    <div class="field"><span class="lbl">Сумма пополнения</span><input id="depositSum" inputmode="decimal" value="${state.deposit}"></div>
    <div class="pay-box">
      <span class="pb-ico">${I.wallet}</span>
      <span><b>@CryptoBot</b><small>${esc(marketConfig.topup_asset)} · оплата в Telegram</small></span>
    </div>
    <p class="pay-hint">Счёт в ${esc(marketConfig.topup_asset)}. 1 ${esc(marketConfig.topup_asset)} = ${num(marketConfig.gram_per_unit)} GRAM.</p>
    <button class="buy" data-pay-submit ${marketConfig.crypto_enabled === false ? 'disabled' : ''}>Оплатить через CryptoBot ${I.arrow}</button>
    ${marketConfig.crypto_enabled === false ? `<p class="pay-note">Пополнение временно недоступно: администратор не подключил Crypto Pay.</p>` : `<p class="pay-note">Баланс зачисляется автоматически после оплаты счёта.</p>`}`);
}

function withdrawSheet() {
  showSheet(`
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div><h3>Вывод средств</h3><p>На кошелёк или @username</p></div>
      <button class="close" data-close>${I.close}</button>
    </div>
    <div class="wallet-card">
      <span>Доступно</span>
      <b><span data-balance>${num(wallet.balance)}</span> <span class="cur">GRAM</span></b>
      <small>Заявка обрабатывается до 24 часов</small>
    </div>
    <div class="field"><span class="lbl">Сумма вывода</span><input id="wdSum" inputmode="decimal" placeholder="от ${num(marketConfig.min_withdraw)}"></div>
    <div class="field"><span class="lbl">Куда вывести</span><input id="wdAddr" placeholder="UQ… / @username"></div>
    <button class="buy" data-withdraw-submit>Вывести ${I.down}</button>
    <p class="pay-note">Заявка сохраняется на сервере, средства резервируются. Выплата вручную, до 24 часов.</p>`);
}

function sellSheet() {
  showSheet(`
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div><h3>Инструкция</h3></div>
      <button class="close" data-close>${I.close}</button>
    </div>
    <div class="holder-chip">${I.shield}<span>@atlanta_holder</span><button data-copy="@atlanta_holder">Копировать</button></div>
    <div class="steps">
      <div class="step"><i>1</i><span><b>Открой свой профиль в Telegram</b></span></div>
      <div class="step"><i>2</i><span><b>Перейди во вкладку «Подарки»</b></span></div>
      <div class="step"><i>3</i><span><b>Нажми «Передать подарок»</b></span></div>
      <div class="step"><i>4</i><span><b>Передай его на @atlanta_holder</b><small>После проверки подарок появится в инвентаре.</small></span></div>
    </div>
    <button class="buy" data-close>Понятно</button>`);
}

/* ============ shell ============ */
const view = document.getElementById('view');
const tabbar = document.getElementById('tabbar');
const searchWrap = document.getElementById('searchWrap');
const sheetBack = document.getElementById('sheetBack');
const sheet = document.getElementById('sheet');
const toastEl = document.getElementById('toast');

function render(keepScroll = false) {
  const y = keepScroll ? view.scrollTop : 0;
  const screens = { store: storeView, rent: rentView, numbers: numbersView, inventory: inventoryView, profile: profileView };
  view.innerHTML = (screens[state.tab] || storeView)();
  view.classList.remove('page-in');
  void view.offsetWidth;
  view.classList.add('page-in');
  view.scrollTop = y;

  const showSearch = ['store', 'rent', 'numbers'].includes(state.tab);
  searchWrap.classList.toggle('hide', !showSearch);
  const q = document.getElementById('q');
  if (q) {
    q.placeholder = state.tab === 'rent' ? 'Поиск в аренде' : state.tab === 'numbers' ? 'Поиск номера' : 'Быстрый поиск';
    q.value = state.query;
    const box = q.closest('.search');
    if (box) box.classList.toggle('has-q', !!state.query);
  }
  updateBalanceUI();
  const tiles = document.getElementById('tabsRow');
  if (tiles) [...tiles.children].forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const chips = document.getElementById('chips');
  if (chips) chips.innerHTML = chipsHTML();
  const filters = document.getElementById('filters');
  if (filters) filters.classList.toggle('hide', !['store', 'rent'].includes(state.tab) || !chipsOpen);
  const filtersBtn = document.getElementById('filtersBtn');
  if (filtersBtn) filtersBtn.classList.toggle('on', chipsOpen);
  const wrap = document.getElementById('searchWrap');
  if (wrap) wrap.classList.toggle('minimal', state.tab === 'numbers');
  [...tabbar.children].forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
}

function showSheet(html) {
  sheet.innerHTML = html;
  sheetBack.classList.add('open');
  sheet.scrollTop = 0;
  animatePrices();
}
function animatePrices() {
  sheet.querySelectorAll('[data-price]').forEach(el => {
    const target = Number(el.dataset.price) || 0;
    const t0 = performance.now();
    const step = t => {
      const p = Math.min(1, (t - t0) / 720);
      const eased = 1 - Math.pow(1 - p, 3);
      el.textContent = p < 1 ? num(target * eased) : num(target);
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
function closeSheet() {
  sheetBack.classList.remove('open');
}

let toastTimer;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2100);
}

/* ============ events ============ */
document.addEventListener('change', e => {
  const sel = e.target.closest('select[data-f]');
  if (!sel) return;
  const key = sel.dataset.f;
  if (key !== 'collection' && !state.collection) {
    toast('Сначала выберите коллекцию');
    render(true);
    return;
  }
  state[key] = sel.value;
  if (key === 'collection') {
    state.model = '';
    state.backdrop = '';
    state.symbol = '';
  }
  state.limit = 24;
  render(true);
});

document.addEventListener('click', async e => {
  const needCollection = e.target.closest('[data-need-collection]');
  if (needCollection) {
    toast('Сначала выберите коллекцию');
    haptic('light');
    return;
  }

  const filtersBtn = e.target.closest('[data-filters]');
  if (filtersBtn) {
    chipsOpen = !chipsOpen;
    haptic('light');
    render(true);
    return;
  }

  const resetF = e.target.closest('[data-reset-f]');
  if (resetF) {
    state.collection = '';
    state.model = '';
    state.backdrop = '';
    state.symbol = '';
    state.limit = 24;
    render(true);
    return;
  }

  const tab = e.target.closest('[data-tab]');
  if (tab) {
    haptic('light');
    state.tab = tab.dataset.tab;
    state.query = '';
    state.limit = 24;
    render();
    if (state.tab === 'inventory' || state.tab === 'profile') refreshMe().then(() => render());
    return;
  }

  const go = e.target.closest('[data-go]');
  if (go) {
    state.tab = go.dataset.go;
    state.query = '';
    state.limit = 24;
    render();
    if (state.tab === 'inventory' || state.tab === 'profile') refreshMe().then(() => render());
    return;
  }

  const numTerm = e.target.closest('[data-num-term]');
  if (numTerm) {
    state.term = Number(numTerm.dataset.numTerm);
    const idx = numTerm.getAttribute('data-index');
    if (idx !== null) numberSheet(Number(idx));
    else render();
    return;
  }

  const term = e.target.closest('[data-term]');
  if (term) { state.term = Number(term.dataset.term); state.limit = 24; state.query = ''; render(); return; }

  const sort = e.target.closest('[data-sort]');
  if (sort) {
    const order = ['curated', 'asc', 'desc'];
    state.sort = order[(order.indexOf(state.sort) + 1) % order.length];
    state.limit = 24;
    render();
    toast('Сортировка: ' + SORT_LABEL[state.sort]);
    return;
  }

  const more = e.target.closest('[data-more]');
  if (more) { state.limit += 24; render(true); return; }

  const fav = e.target.closest('[data-fav]');
  if (fav) {
    e.preventDefault(); e.stopPropagation();
    const id = fav.dataset.fav;
    if (state.favs.has(id)) { state.favs.delete(id); fav.classList.remove('on'); toast('Убрано из избранного'); }
    else { state.favs.add(id); fav.classList.add('on'); toast('Добавлено в избранное'); }
    try { localStorage.setItem('atlanta-market:favs:v1', JSON.stringify([...state.favs])); } catch (err) {}
    return;
  }

  const gift = e.target.closest('[data-gift]');
  if (gift) { haptic('light'); giftSheet(gift.dataset.gift); return; }

  const number = e.target.closest('[data-number]');
  if (number) { haptic('light'); numberSheet(Number(number.dataset.number)); return; }

  const buy = e.target.closest('[data-buy]');
  if (buy) {
    let order = null;
    try { order = buy.getAttribute('data-order') ? JSON.parse(buy.getAttribute('data-order')) : null; } catch (err) {}
    if (!order || !window.AtlantaOrders) return;
    const label = buy.innerHTML;
    buy.disabled = true;
    buy.innerHTML = 'Создаём заказ…';
    try {
      const saved = await window.AtlantaOrders.create(order);
      await refreshMe();
      closeSheet();
      haptic('medium');
      toast((buy.dataset.buy || 'Заказ оплачен') + ' · ' + num(saved.amount));
      render();
    } catch (err) {
      buy.disabled = false;
      buy.innerHTML = label;
      if (err.status === 409) {
        toast('Недостаточно средств · пополни кошелёк');
        closeSheet();
        depositSheet();
      } else {
        toast(err.message || 'Не удалось создать заказ');
      }
    }
    return;
  }

  const refreshOrders = e.target.closest('[data-refresh-orders]');
  if (refreshOrders) {
    await refreshMe();
    render();
    toast('Список обновлён');
    return;
  }

  const clearQ = e.target.closest('[data-clear-q]');
  if (clearQ) {
    state.query = '';
    state.limit = 24;
    render();
    const input = document.getElementById('q');
    if (input) input.focus();
    return;
  }

  const walletBtn = e.target.closest('[data-wallet]');
  if (walletBtn) { walletSheet(); return; }

  const sellBtn = e.target.closest('[data-sell]');
  if (sellBtn) { sellSheet(); return; }

  const depositBtn = e.target.closest('[data-deposit]');
  if (depositBtn) { depositSheet(); return; }

  const withdrawBtn = e.target.closest('[data-withdraw]');
  if (withdrawBtn) { withdrawSheet(); return; }

  const amountBtn = e.target.closest('[data-amount]');
  if (amountBtn) {
    state.deposit = Number(amountBtn.dataset.amount);
    document.querySelectorAll('[data-amount]').forEach(b => b.classList.toggle('on', Number(b.dataset.amount) === state.deposit));
    const input = document.getElementById('depositSum');
    if (input) input.value = state.deposit;
    return;
  }

  const paySubmit = e.target.closest('[data-pay-submit]');
  if (paySubmit) {
    const amount = Number((document.getElementById('depositSum')?.value || '').replace(',', '.'));
    if (!amount || amount < marketConfig.min_topup) { toast('Минимум ' + num(marketConfig.min_topup)); return; }
    paySubmit.disabled = true;
    paySubmit.textContent = 'Создаём счёт…';
    haptic('light');
    startTopup(amount).then(inv => {
      if (tg && tg.openInvoice && inv.miniAppUrl) {
        tg.openInvoice(inv.miniAppUrl, status => {
          if (status === 'paid') { waitTopup(); return; }
          paySubmit.disabled = false;
          paySubmit.textContent = 'Оплатить через CryptoBot';
          toast(status === 'cancelled' ? 'Счёт отменён' : 'Счёт не оплачен');
        });
        return;
      }
      if (inv.payUrl) window.open(inv.payUrl, '_blank');
      waitTopup();
    }).catch(err => {
      paySubmit.disabled = false;
      paySubmit.textContent = 'Оплатить через CryptoBot';
      toast(err.message || 'Не удалось создать счёт');
    });
    return;
  }

  const wdSubmit = e.target.closest('[data-withdraw-submit]');
  if (wdSubmit) {
    const amount = Number((document.getElementById('wdSum')?.value || '').replace(',', '.'));
    const addr = (document.getElementById('wdAddr')?.value || '').trim();
    if (!amount || amount <= 0) { toast('Укажи сумму вывода'); return; }
    if (amount < marketConfig.min_withdraw) { toast('Минимум ' + num(marketConfig.min_withdraw)); return; }
    if (amount > wallet.balance) { toast('Недостаточно средств на балансе'); return; }
    if (!addr) { toast('Укажи адрес кошелька'); return; }
    const label = wdSubmit.innerHTML;
    wdSubmit.disabled = true;
    wdSubmit.innerHTML = 'Создаём заявку…';
    try {
      await api('/withdraw', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ amount, address: addr })
      });
      await refreshMe();
      closeSheet();
      haptic('medium');
      toast('Заявка на вывод создана');
      if (state.tab === 'profile' || state.tab === 'inventory') render();
    } catch (err) {
      wdSubmit.disabled = false;
      wdSubmit.innerHTML = label;
      toast(err.message || 'Не удалось создать заявку');
    }
    return;
  }

  const copyBtn = e.target.closest('[data-copy]');
  if (copyBtn) {
    const value = copyBtn.dataset.copy || '';
    try { navigator.clipboard.writeText(value); } catch (err) {}
    toast('Скопировано: ' + value);
    return;
  }

  const t = e.target.closest('[data-toast]');
  if (t) { toast(t.dataset.toast); return; }

  if (e.target.closest('[data-close]') || e.target === sheetBack) { closeSheet(); }
});

document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  state.query = e.target.value;
  state.limit = 24;
  const caret = e.target.selectionStart;
  render();
  const input = document.getElementById('q');
  if (input) { input.focus(); input.setSelectionRange(caret, caret); }
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

document.addEventListener('pointerdown', e => {
  const el = e.target.closest('button, .m-row, .cat, .amount');
  if (!el || el.disabled) return;
  const rect = el.getBoundingClientRect();
  const dot = document.createElement('span');
  dot.className = 'tap';
  dot.style.left = (e.clientX - rect.left) + 'px';
  dot.style.top = (e.clientY - rect.top) + 'px';
  el.appendChild(dot);
  setTimeout(() => dot.remove(), 620);
});

/* ============ loader ============ */
(function loader() {
  const el = document.getElementById('loader');
  if (!el) return;
  const bar = document.getElementById('loadBar');
  const pct = document.getElementById('loadPct');
  const start = performance.now();
  let hidden = false;
  function hide() {
    if (hidden) return;
    hidden = true;
    el.classList.add('done');
    setTimeout(() => el.remove(), 800);
  }
  function tick(t) {
    const p = Math.min(1, (t - start) / 1750);
    const eased = 1 - Math.pow(1 - p, 3);
    if (bar) bar.style.width = (eased * 100).toFixed(1) + '%';
    if (pct) pct.textContent = Math.round(eased * 100) + '%';
    if (p < 1) requestAnimationFrame(tick);
    else setTimeout(hide, 260);
  }
  requestAnimationFrame(tick);
  el.addEventListener('click', hide);
  setTimeout(hide, 3800);
})();

render();

(async function boot() {
  await loadMarketConfig();
  if (!tgInitData()) {
    toast('Открой маркет внутри Telegram');
    render();
    return;
  }
  await refreshMe();
  updateBalanceUI();
  if (state.tab === 'profile' || state.tab === 'inventory') render();
})();

</script>
</body>
</html>
