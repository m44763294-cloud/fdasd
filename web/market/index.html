<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0B">
<title>Gumroad Market — Telegram gifts, rent & anonymous numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Unbounded:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --ink:#04050a; --screen:#07080e;
  --text:#f4f7ff; --muted:#8d97b0; --dim:#5f6880;
  --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.14);
  --violet:#7c6cff; --cyan:#39e6ff; --mint:#5df2b8; --pink:#ff6aa8; --gold:#ffcf6a;
  --grad:linear-gradient(100deg,#7c6cff,#39e6ff);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --display:"Unbounded","Manrope",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--text);background:var(--ink);
  display:flex;justify-content:center;min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(55% 45% at 50% 2%,rgba(96,72,230,.16),transparent 62%),
    radial-gradient(38% 38% at 88% 82%,rgba(40,205,255,.07),transparent 60%),
    radial-gradient(30% 30% at 8% 70%,rgba(255,106,168,.05),transparent 60%),
    #030409;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 44%,#000 18%,transparent 72%);
  mask-image:radial-gradient(circle at 50% 44%,#000 18%,transparent 72%);
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}
a{color:inherit}

/* ============ desktop stage ============ */
.stage{
  position:relative;width:min(1280px,100vw);min-height:1040px;
  display:flex;align-items:center;justify-content:center;padding:74px 0 96px;
}
.stage::before{
  content:"A";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font:800 760px var(--display);line-height:1;letter-spacing:-.1em;color:rgba(255,255,255,.022);
  pointer-events:none;user-select:none;
}
.stage-brand{position:absolute;top:38px;left:62px;display:flex;align-items:center;gap:13px;z-index:5}
.stage-brand .smark{height:27px;width:auto;filter:drop-shadow(0 8px 24px rgba(150,170,255,.22))}
.stage-brand b{display:block;font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.13em;line-height:1}
.stage-brand i{display:block;font-style:normal;font-size:7.5px;letter-spacing:.44em;color:#69728b;font-weight:700;margin-top:6px}
.stage-pill{
  position:absolute;top:44px;right:62px;z-index:5;display:flex;align-items:center;gap:8px;
  height:36px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.09);
  background:rgba(255,255,255,.035);font-size:9px;font-weight:700;letter-spacing:.14em;color:#b9c3d8;
}
.stage-pill i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.stage-foot{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.foot-pill{
  height:32px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.08);
  background:rgba(255,255,255,.03);display:flex;align-items:center;gap:6px;
  font-size:8.5px;font-weight:600;color:#8a94ab;white-space:nowrap;
}
.foot-pill b{color:#dfe7f6;font-weight:800}

/* ============ phone ============ */
.phone{
  position:relative;padding:12px;border-radius:62px;z-index:3;
  background:linear-gradient(155deg,#2d3140,#0b0c11 46%,#1b1f2a 100%);
  box-shadow:
    0 60px 140px -30px rgba(0,0,0,.95),
    0 0 0 1px rgba(255,255,255,.08),
    inset 0 1px 0 rgba(255,255,255,.22);
}
.phone::before{
  content:"";position:absolute;inset:-90px;z-index:-1;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,rgba(96,72,230,.2),rgba(40,205,255,.07) 42%,transparent 68%);
  filter:blur(26px);
}
.screen{
  position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;
  background:var(--screen);isolation:isolate;display:flex;flex-direction:column;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
}
.screen::after{
  content:"";position:absolute;inset:0;z-index:31;border-radius:50px;pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);
}

/* aurora */
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(58px);animation:drift 19s ease-in-out infinite alternate}
.bg .b1{width:310px;height:310px;left:-130px;top:40px;background:#4b2bd8;opacity:.5}
.bg .b2{width:270px;height:270px;right:-120px;top:270px;background:#0c9bb8;opacity:.3;animation-delay:-6s}
.bg .b3{width:250px;height:250px;left:30px;bottom:-40px;background:#8a2bd8;opacity:.22;animation-delay:-11s}

/* status bar */
.statusbar{
  flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;font-size:11px;font-weight:800;letter-spacing:.02em;color:#eef3ff;z-index:12;
}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:108px;height:28px;border-radius:999px;background:#000;z-index:13;box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.island::after{content:"";position:absolute;right:12px;top:9px;width:7px;height:7px;border-radius:50%;background:#0c1626;box-shadow:inset 0 0 3px rgba(70,150,255,.6)}
.sb-icons{display:flex;align-items:center;gap:5px}
.sb-icons svg{height:11px;width:auto}

/* app frame */
.app{flex:1;min-height:0;display:flex;flex-direction:column;position:relative;z-index:3}

/* top bar */
.topbar{flex:none;display:flex;align-items:center;gap:9px;padding:3px 16px 11px}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo>img{height:19px;width:auto;flex:none;filter:drop-shadow(0 6px 18px rgba(140,175,255,.26))}
.logo-txt b{display:block;font-family:var(--display);font-size:11px;font-weight:700;letter-spacing:.17em;line-height:1}
.logo-txt i{display:block;font-style:normal;font-size:6.2px;letter-spacing:.44em;color:#6d7690;margin-top:4px;font-weight:700}
.bal{
  display:flex;align-items:center;gap:5px;height:32px;padding:0 11px;border-radius:999px;flex:none;
  border:1px solid rgba(124,108,255,.34);
  background:linear-gradient(135deg,rgba(124,108,255,.18),rgba(57,230,255,.08));
  font-size:9.5px;font-weight:800;white-space:nowrap;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.13),0 8px 20px -10px rgba(124,108,255,.38);
}
.bal span{font-size:6.2px;letter-spacing:.14em;color:#a9b6d6;margin-top:1px}
.ava{
  width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(140deg,#8b7bff,#39c8ff);color:#070b14;font-weight:800;font-size:12px;
  box-shadow:0 0 0 2px rgba(255,255,255,.09),0 8px 20px -6px rgba(90,120,255,.55);
}
.ava:active{transform:scale(.94)}

/* search */
.searchbar{flex:none;padding:0 16px 12px;transition:.2s}
.searchbar.hide{display:none}
.search{
  display:flex;align-items:center;gap:9px;height:42px;padding:0 13px;border-radius:15px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.22s;
}
.search:focus-within{border-color:rgba(57,230,255,.45);box-shadow:0 0 0 3px rgba(57,230,255,.07);background:rgba(255,255,255,.055)}
.search>svg{width:16px;height:16px;color:#7b86a2;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font-size:10.5px;font-weight:500}
.search input::placeholder{color:#5d667e}
.q-clear{display:none;width:18px;height:18px;border-radius:50%;place-items:center;flex:none;color:#98a3bd;background:rgba(255,255,255,.08)}
.q-clear svg{width:9px;height:9px}
.search.has-q .q-clear{display:grid}
.search.has-q kbd{display:none}
.search kbd{font:700 7.5px var(--mono);color:#6b7590;border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:2px 4px}

/* scroll view */
.view{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:0 16px 90px;
  scrollbar-width:none;overscroll-behavior:contain;position:relative;z-index:2;
}
.view::-webkit-scrollbar{width:0}
.view.page-in{animation:pageIn .42s cubic-bezier(.22,1,.36,1)}

/* hero */
.hero{
  position:relative;min-height:212px;border-radius:26px;padding:18px 16px;
  display:flex;align-items:center;overflow:hidden;border:1px solid rgba(124,108,255,.26);
  background:linear-gradient(135deg,#191449 0%,#101a44 46%,#0a2b3d 100%);
  box-shadow:0 26px 55px -24px rgba(60,40,200,.6),inset 0 1px 0 rgba(255,255,255,.1);
}
.hero::before{
  content:"";position:absolute;inset:-65%;opacity:.55;
  background:conic-gradient(from 90deg at 50% 50%,rgba(124,108,255,.55),rgba(57,230,255,.28),rgba(255,106,168,.22),rgba(124,108,255,.55));
  filter:blur(46px);animation:spin 24s linear infinite;
}
.hero::after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(7,8,15,.76),rgba(7,8,15,.28) 58%,transparent 78%);
}
.hero-copy{position:relative;z-index:3;width:63%;min-height:150px;display:flex;flex-direction:column;justify-content:center}
.hero h1{font-size:22px;line-height:1.1;font-weight:800;letter-spacing:-.035em;text-wrap:balance}
.hero h1 span{
  background:linear-gradient(100deg,#fff 0%,#9fe9ff 52%,#5dffd2 88%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero p{margin-top:9px;font-size:8.8px;line-height:1.55;color:#a9bbdd;font-weight:500;max-width:150px}
.hero-art{position:absolute;inset:0;z-index:2;pointer-events:none}
.hero-mark{position:absolute;left:-4px;bottom:-16px;height:78px;width:auto;opacity:.055;pointer-events:none;z-index:1}
.hero-art::before{content:"";position:absolute;width:210px;height:210px;right:-30px;top:0;border-radius:50%;background:radial-gradient(circle,rgba(57,230,255,.28),transparent 66%);filter:blur(10px)}
.hero-art img{
  position:absolute;object-fit:cover;border-radius:18px;
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 20px 34px rgba(0,0,0,.6);
  animation:float 7s ease-in-out infinite;
}
.hero-art .g1{width:104px;height:104px;right:14px;top:16px;--r:-9deg}
.hero-art .g2{width:84px;height:84px;right:86px;top:104px;--r:10deg;animation-delay:-3.2s}

/* categories */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 18px}
.cat{
  position:relative;min-height:108px;border-radius:22px;padding:13px;overflow:hidden;
  display:flex;flex-direction:column;justify-content:space-between;text-align:left;
  border:1px solid var(--line);background:linear-gradient(160deg,var(--c1),rgba(255,255,255,.014));
  transition:transform .24s,border-color .24s,box-shadow .24s;
}
.cat::before{
  content:"";position:absolute;width:160px;height:160px;right:-56px;top:-64px;border-radius:50%;
  background:radial-gradient(circle,var(--c2),transparent 66%);filter:blur(7px);
}
.cat::after{
  content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.13) 50%,transparent 62%);
  transform:translateX(-140%);transition:transform .75s;
}
.cat:hover{transform:translateY(-3px);border-color:var(--c3);box-shadow:0 18px 34px -18px var(--c3)}
.cat:hover::after{transform:translateX(140%)}
.cat:active{transform:scale(.985)}
.cat-ico{
  width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:#fff;position:relative;z-index:2;
  background:linear-gradient(145deg,var(--i1),var(--i2));
  border:1px solid rgba(255,255,255,.24);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.38),0 10px 22px -8px var(--i2);
}
.cat-ico svg{width:20px;height:20px}
.cat-ico.ico-rent,.cat-ico.ico-888{
  width:max-content;align-self:flex-start;
  font:800 17px/1 var(--display);letter-spacing:-.05em;
  background:none;
  background-image:linear-gradient(100deg,#c6f8ff,#39e6ff 60%,#8b7bff);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  border:0;box-shadow:none;text-shadow:none;
}
.cat-txt{position:relative;z-index:2}
.cat b{display:block;font-size:13px;font-weight:800;letter-spacing:-.02em}
.cat small{display:block;font-size:8px;color:rgba(255,255,255,.62);margin-top:3px;font-weight:600}
.cat-arrow{
  position:absolute;right:11px;top:11px;width:26px;height:26px;border-radius:50%;z-index:2;
  display:grid;place-items:center;color:#d4ddf0;background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);transition:.2s;
}
.cat-arrow svg{width:12px;height:12px}
.cat:hover .cat-arrow{background:rgba(255,255,255,.17);transform:translate(1px,-1px)}
.cat-rent{--c1:rgba(124,108,255,.16);--c2:rgba(150,124,255,.32);--c3:rgba(140,120,255,.42);--i1:#b3a7ff;--i2:#4a34b8}
.cat-num{--c1:rgba(57,230,255,.16);--c2:rgba(57,230,255,.34);--c3:rgba(57,230,255,.45);--i1:#66ecff;--i2:#0a7fc6}

/* section head */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin:0 0 12px}
.sec-head h2{font-size:15px;font-weight:800;letter-spacing:-.025em}
.sec-head p{font-size:8px;color:var(--dim);margin-top:3px;font-weight:600}
.sort-btn{
  display:flex;align-items:center;gap:5px;height:27px;padding:0 9px;border-radius:999px;flex:none;
  border:1px solid var(--line);background:rgba(255,255,255,.04);
  font-size:8px;font-weight:700;color:#b9c4dd;transition:.2s;
}
.sort-btn svg{width:11px;height:11px;color:#8b97b5}
.sort-btn:hover{border-color:rgba(57,230,255,.35);color:#fff;background:rgba(57,230,255,.07)}

/* gift grid */
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.gift{
  position:relative;display:flex;flex-direction:column;overflow:hidden;text-align:left;
  border-radius:20px;border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(170deg,rgba(255,255,255,.06),rgba(255,255,255,.014));
  transition:transform .22s,border-color .22s,box-shadow .22s;
  animation:rise .52s cubic-bezier(.22,1,.36,1) both;
  animation-delay:calc(var(--i,0) * 26ms);
}
.gift:hover{transform:translateY(-3px);border-color:rgba(124,108,255,.42);box-shadow:0 18px 36px -18px rgba(90,80,255,.5)}
.gift:active{transform:scale(.985)}
.gift-art{
  position:relative;display:block;aspect-ratio:1/.94;overflow:hidden;isolation:isolate;
  background:#0a0c13;
}
.gift-art img{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;
  animation:gaPhoto 9s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * -.7s);
}
.gift-art::after{
  content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,12,.14),transparent 38%,transparent 68%,rgba(6,7,12,.6));
}
.gift-shine{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.12) 48%,transparent 60%);
  translate:-135% 0;animation:gaShine 7.5s ease-in-out infinite;
  animation-delay:calc(var(--i,0) * -.9s);
}
@keyframes gaPhoto{0%,100%{scale:1.02;translate:0 0}50%{scale:1.08;translate:0 -1.5%}}
@keyframes gaShine{0%,72%{translate:-135% 0}92%,100%{translate:135% 0}}
.fav{
  position:absolute;z-index:4;right:8px;top:8px;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;color:#e2e8f6;
  background:rgba(8,10,16,.45);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);
  transition:.18s;
}
.fav svg{width:13px;height:13px;pointer-events:none}
.fav:hover{transform:scale(1.09);border-color:rgba(255,255,255,.32)}
.fav.on{color:#ff6aa8;background:rgba(255,106,168,.17);border-color:rgba(255,106,168,.52)}
.fav.on svg{fill:currentColor;animation:pop .35s}
.gift-info{display:flex;flex-direction:column;gap:2px;padding:9px 10px 10px;position:relative;z-index:3}
.gift-name{font-size:10.5px;font-weight:800;letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-sub{font-size:7.4px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.gift-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:5px;margin-top:6px}
.price{font-size:8px;font-weight:700;white-space:nowrap;color:#8190ad}
.price b{
  font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:-.045em;
  background:linear-gradient(100deg,#fff,#a9ecff);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.price i{font-style:normal;font-size:6.2px;letter-spacing:.1em;color:#7d89a6;margin-left:2px}
.rent-min{font-size:6.6px;color:#6c7791;font-weight:600;white-space:nowrap}
.term-badge{
  position:absolute;z-index:4;left:8px;top:8px;height:19px;padding:0 7px;border-radius:999px;
  background:rgba(8,10,16,.52);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(8px);
  font:700 6.4px var(--font);letter-spacing:.1em;color:#d7e2f5;
}
.more{
  width:100%;height:48px;margin:3px 0 18px;border-radius:16px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid rgba(124,108,255,.3);
  background:linear-gradient(135deg,rgba(124,108,255,.17),rgba(57,230,255,.08));
  font-size:10px;font-weight:800;transition:.22s;
}
.more span{font-size:7.4px;font-weight:600;color:#8d98b5}
.more::after{
  content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.14) 50%,transparent 65%);
  transform:translateX(-130%);transition:transform .8s;
}
.more:hover{border-color:rgba(57,230,255,.5);box-shadow:0 14px 30px -16px rgba(57,230,255,.5)}
.more:hover::after{transform:translateX(130%)}

/* teaser */
.teaser{
  position:relative;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:16px;border-radius:22px;overflow:hidden;text-align:left;margin-bottom:16px;
  border:1px solid rgba(57,230,255,.22);
  background:linear-gradient(120deg,rgba(57,230,255,.14),rgba(124,108,255,.12) 58%,rgba(255,106,168,.1));
}
.teaser::after{content:"+888";position:absolute;right:6px;bottom:-28px;font:800 82px var(--display);letter-spacing:-.08em;color:rgba(255,255,255,.05)}
.teaser b{display:block;font-size:12px;font-weight:800}
.teaser p{font-size:8px;color:#9daac6;margin-top:4px;max-width:205px;line-height:1.5}
.teaser-arrow{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);transition:.2s;position:relative;z-index:2;
}
.teaser-arrow svg{width:14px;height:14px}
.teaser:hover .teaser-arrow{background:rgba(255,255,255,.18);transform:translateX(2px)}

/* page head / terms */
.page-head{padding:6px 2px 15px}
.page-head h1{font-family:var(--display);font-size:20px;letter-spacing:-.05em;font-weight:700;line-height:1.1}
.page-head p{font-size:8.8px;color:#8f9ab5;line-height:1.6;margin-top:8px;max-width:305px}
.terms{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);margin-bottom:18px}
.term{
  position:relative;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;gap:4px;
  font-size:9px;font-weight:700;color:#99a4be;transition:.22s;
}
.term b{font-size:6.4px;color:var(--mint);background:rgba(93,242,184,.12);padding:2px 4px;border-radius:4px;font-weight:800}
.term.on{background:linear-gradient(135deg,#7c6cff,#39e6ff);color:#070b12;box-shadow:0 10px 24px -10px rgba(90,160,255,.8)}
.term.on b{background:rgba(7,11,18,.18);color:#071018}

/* numbers */
.num-banner{
  position:relative;border-radius:26px;padding:18px 16px;overflow:hidden;margin:4px 0 18px;min-height:182px;
  border:1px solid rgba(57,230,255,.24);
  background:linear-gradient(125deg,rgba(57,230,255,.16),rgba(124,108,255,.18) 56%,rgba(255,106,168,.1));
}
.num-banner::before{
  content:"";position:absolute;width:220px;height:220px;right:-60px;top:-80px;border-radius:50%;
  background:radial-gradient(circle,rgba(57,230,255,.28),transparent 68%);filter:blur(8px);
}
.num-banner .ghost{position:absolute;right:6px;top:-34px;font:800 96px var(--display);letter-spacing:-.09em;color:rgba(255,255,255,.05)}
.num-banner h1{position:relative;z-index:2;font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:8px}
.num-banner h1 span{background:linear-gradient(100deg,#c6f8ff,#39e6ff 60%,#8b7bff);-webkit-background-clip:text;background-clip:text;color:transparent}
.num-banner p{position:relative;z-index:2;font-size:8.4px;color:#a6b7d7;line-height:1.55;margin-top:7px;max-width:255px}
.nb-stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:16px}
.nb-stats div{padding:8px 9px;border-radius:12px;background:rgba(5,8,15,.36);border:1px solid rgba(255,255,255,.08)}
.nb-stats b{display:block;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:-.03em}
.nb-stats span{display:block;font-size:6.2px;color:#7d93b3;margin-top:3px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.num-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:16px}
.num-card{
  position:relative;min-height:106px;border-radius:19px;padding:13px 12px 12px;overflow:hidden;text-align:left;
  display:flex;flex-direction:column;justify-content:space-between;
  border:1px solid var(--line);background:linear-gradient(165deg,var(--tone),rgba(255,255,255,.014));
  transition:transform .22s,border-color .22s,box-shadow .22s;
  animation:rise .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0) * 26ms);
}
.num-card::before,.num-card::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(120,220,255,.14)}
.num-card::before{width:88px;height:88px;right:-30px;bottom:-30px}
.num-card::after{width:52px;height:52px;right:-12px;bottom:-12px;border-color:rgba(120,220,255,.1)}
.num-card:hover{transform:translateY(-3px);border-color:rgba(57,230,255,.4);box-shadow:0 16px 32px -16px rgba(57,230,255,.35)}
.num-val{position:relative;z-index:2;font-family:var(--mono);font-size:12.2px;font-weight:700;letter-spacing:-.05em;white-space:nowrap}
.num-val i{font-style:normal;color:#66809f}
.num-foot{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;margin-top:16px}
.num-price b{font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:-.04em}
.num-price span{display:block;font-size:6.9px;color:#7f92b2;margin-top:3px}
.num-go{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(57,230,255,.12);border:1px solid rgba(57,230,255,.2);color:#8beaff}
.num-go svg{width:12px;height:12px}

/* inventory / profile */
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px 9px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.035);text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:-.05em}
.stat span{display:block;font-size:6.3px;color:#78839c;margin-top:4px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}
.orders{display:flex;flex-direction:column;gap:7px;margin-bottom:10px}
.order{
  display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:16px;
  border:1px solid var(--line);background:rgba(255,255,255,.035);
  animation:rise .4s cubic-bezier(.22,1,.36,1) both;
}
.order-ico{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;background:rgba(124,108,255,.16);border:1px solid rgba(124,108,255,.18);color:#c0b8ff}
.order-ico svg{width:15px;height:15px}
.order-main{min-width:0;flex:1}
.order-main b{display:block;font-size:9.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-main small{display:block;font-size:7.3px;color:#77829b;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.order-sum{text-align:right;flex:none}
.order-sum b{display:block;font:700 10px var(--mono);letter-spacing:-.03em}
.order-sum small{display:block;font-size:6.2px;color:#ffcf6a;margin-top:3px;letter-spacing:.04em}
.note{font-size:7.4px;color:#66708a;line-height:1.6;text-align:center;padding:3px 10px 9px}
.empty{padding:28px 14px 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ring{
  width:74px;height:74px;border-radius:50%;display:grid;place-items:center;position:relative;margin-bottom:15px;
  background:radial-gradient(circle,rgba(124,108,255,.22),transparent 70%);
  border:1px solid rgba(124,108,255,.22);color:#bab2ff;
}
.ring::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(124,108,255,.2);animation:pulseRing 2.6s infinite}
.ring svg{width:28px;height:28px}
.empty b{font-size:13px;font-weight:800}
.empty p{font-size:8.4px;color:#7b86a0;line-height:1.65;margin-top:7px;max-width:235px}

/* me card */
.me-card{
  position:relative;border-radius:24px;padding:16px;overflow:hidden;margin-bottom:12px;
  border:1px solid rgba(124,108,255,.2);
  background:linear-gradient(140deg,rgba(124,108,255,.12),rgba(57,230,255,.05) 56%,rgba(255,255,255,.025));
}
.me-card::before{content:"";position:absolute;width:220px;height:220px;right:-70px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(124,108,255,.3),transparent 68%);filter:blur(8px)}
.me-top{display:flex;align-items:center;gap:11px;position:relative;z-index:2}
.ava.big{width:52px;height:52px;font-size:18px;box-shadow:0 0 0 3px rgba(255,255,255,.08),0 0 34px rgba(124,108,255,.55)}
.me-name b{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.me-name small{display:block;font-size:8px;color:#8c97b2;margin-top:3px}
.id-chip{margin-left:auto;padding:5px 7px;border-radius:8px;border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.22);font:700 6.6px var(--mono);letter-spacing:.08em;color:#a9b6d6;white-space:nowrap}
.me-bal{margin-top:15px;padding-top:13px;border-top:1px solid rgba(255,255,255,.08);position:relative;z-index:2}
.me-bal>span{font-size:6.6px;letter-spacing:.18em;text-transform:uppercase;color:#8490ad;font-weight:700}
.me-bal b{
  display:block;margin-top:4px;font-family:var(--mono);font-size:25px;font-weight:700;letter-spacing:-.055em;
  background:linear-gradient(100deg,#fff,#9fe9ff 58%,#6fffd6);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.me-bal b i{font-style:normal;font-size:8.5px;letter-spacing:.16em;-webkit-text-fill-color:#8fa3c8;margin-left:2px}
.me-bal small{display:block;font-size:7.2px;color:#7de8c0;margin-top:6px;font-weight:600}

/* menu / club */
.menu{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.m-row{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;text-align:left;
  border:1px solid var(--line);background:rgba(255,255,255,.032);font-size:9.8px;font-weight:700;
  transition:.2s;
}
.m-row:hover{border-color:rgba(124,108,255,.35);background:rgba(255,255,255,.052)}
.mi{
  width:30px;height:30px;border-radius:10px;flex:none;display:grid;place-items:center;color:#9fb4e6;
  background:none;border:0;
}
.mi svg{width:15px;height:15px}
.mi.mi-rent{width:30px}
.mi.mi-rent svg{width:18px;height:18px;color:#6fb4ff;filter:drop-shadow(0 0 6px rgba(60,150,255,.5))}
.mi.mi-num{
  background:none;border:0;box-shadow:none;width:32px;
  font:800 10px/1 var(--display);letter-spacing:-.06em;
  background-image:linear-gradient(100deg,#c6f8ff,#39e6ff 60%,#8b7bff);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 6px rgba(57,230,255,.35));
}
.m-tag{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:6px;display:grid;place-items:center;background:rgba(93,242,184,.12);color:#6ff0bd;font:700 8px var(--mono)}
.m-arrow{margin-left:auto;color:#5b6680;font-size:16px;line-height:1}
.m-tag + .m-arrow{margin-left:2px}
.club{
  position:relative;display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;overflow:hidden;margin-bottom:12px;
  border:1px solid rgba(255,207,106,.25);
  background:linear-gradient(120deg,rgba(255,207,106,.14),rgba(255,106,168,.09));
}
.club .big{
  font:800 30px var(--display);line-height:1;letter-spacing:-.05em;
  background:linear-gradient(120deg,#ffe8ac,#ffb84d);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.club b{display:block;font-size:11px;font-weight:800}
.club p{font-size:7.2px;color:#b9a98b;margin-top:3px;line-height:1.4}
.club-btn{margin-left:auto;height:30px;padding:0 12px;border-radius:10px;background:#ffe6b0;color:#241a06;font-size:8.4px;font-weight:800;flex:none}
.club-btn:hover{background:#fff0c9}

/* tabbar */
.tabbar{
  position:absolute;left:12px;right:12px;bottom:12px;height:62px;z-index:20;
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px;border-radius:22px;
  background:rgba(12,14,22,.8);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(22px);
  box-shadow:0 18px 40px -16px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.07);
}
.tab{
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:16px;color:#697389;font-size:6.3px;font-weight:700;z-index:2;transition:.2s;
}
.tab svg{width:19px;height:19px;transition:.22s}
.tab-num{
  display:grid;place-items:center;height:19px;font:800 9.5px/1 var(--mono);letter-spacing:-.05em;
  background:linear-gradient(100deg,#c6f8ff,#39e6ff 60%,#8b7bff);-webkit-background-clip:text;background-clip:text;color:transparent;
  transition:.22s;
}
.tab.on .tab-num{filter:drop-shadow(0 0 8px rgba(57,230,255,.6));transform:translateY(-1px)}
.tab.on{color:#fff}
.tab.on svg{color:#9ff3ff;filter:drop-shadow(0 0 8px rgba(57,230,255,.55));transform:translateY(-1px)}
.tab.on::before{
  content:"";position:absolute;inset:0;border-radius:15px;z-index:-1;
  background:linear-gradient(160deg,rgba(124,108,255,.26),rgba(57,230,255,.1));
  border:1px solid rgba(124,108,255,.25);animation:tabIn .3s;
}

/* sheet */
.sheet-back{
  position:absolute;inset:0;z-index:46;display:flex;align-items:flex-end;
  background:rgba(3,4,8,.62);backdrop-filter:blur(7px);
  opacity:0;visibility:hidden;transition:.28s;
}
.sheet-back.open{opacity:1;visibility:visible}
.sheet{
  width:100%;max-height:90%;overflow-y:auto;scrollbar-width:none;
  padding:8px 16px 24px;border-radius:30px 30px 0 0;
  background:linear-gradient(180deg,#151827,#0a0c15 42%);
  border-top:1px solid rgba(255,255,255,.12);
  box-shadow:0 -30px 80px rgba(0,0,0,.75);
  transform:translateY(102%);transition:transform .42s cubic-bezier(.18,1.04,.3,1);
}
.sheet::-webkit-scrollbar{width:0}
.sheet-back.open .sheet{transform:translateY(0)}
.sheet-grab{width:38px;height:4px;border-radius:99px;background:rgba(255,255,255,.18);margin:2px auto 12px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px}
.sheet-head h3{font-size:16px;font-weight:800;letter-spacing:-.03em}
.sheet-head p{font-size:8px;color:#7f8ba6;margin-top:4px}
.close{
  width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;color:#aab4cc;
  border:1px solid var(--line);background:rgba(255,255,255,.05);transition:.2s;
}
.close:hover{background:rgba(255,255,255,.1);color:#fff}
.close svg{width:12px;height:12px}
.gstage{
  position:relative;height:250px;border-radius:24px;overflow:hidden;margin-bottom:14px;isolation:isolate;
  border:1px solid rgba(255,255,255,.08);background:#0a0c13;
}
.gs-photo{position:absolute;inset:0;z-index:1;overflow:hidden}
.gs-photo .gs-main{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:gsPhoto 11s ease-in-out infinite;
}
.gstage::after{
  content:"";position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(180deg,rgba(6,7,12,.1),transparent 45%,rgba(6,7,12,.58));
}
.gs-price{
  position:absolute;z-index:5;left:13px;bottom:13px;display:flex;align-items:baseline;gap:5px;
  padding:7px 11px;border-radius:13px;border:1px solid rgba(255,255,255,.14);
  background:rgba(7,8,14,.62);backdrop-filter:blur(12px);
}
.gs-price b{font:700 15px var(--mono);letter-spacing:-.04em}
.gs-price i{font-style:normal;font:700 6.4px var(--font);letter-spacing:.16em;color:#8d97b0}
.gs-sym{
  position:absolute;z-index:5;right:13px;bottom:13px;display:flex;align-items:center;gap:5px;
  max-width:47%;padding:6px 9px;border-radius:11px;border:1px solid rgba(255,255,255,.1);
  background:rgba(7,8,14,.55);font:700 7px var(--font);color:#dbe4f6;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gs-sym b{font-size:11px;font-weight:400;color:#fff;opacity:.85}
@keyframes gsPhoto{0%,100%{scale:1.03;translate:0 0}50%{scale:1.09;translate:0 -1%}}
.attrs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}
.attr{padding:9px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.035);min-width:0}
.attr span{font-size:6.2px;letter-spacing:.12em;text-transform:uppercase;color:#6e7891;font-weight:700}
.attr b{display:block;font-size:8.4px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attr i{display:block;font-style:normal;font-size:6.3px;color:#5df2b8;margin-top:3px}
.sheet-rows{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.025);margin-bottom:14px}
.sheet-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;font-size:8.4px;color:#8d97b0;border-bottom:1px solid rgba(255,255,255,.05)}
.sheet-row:last-child{border:0}
.sheet-row b{color:#eaf0ff;font-size:8.4px;font-weight:700;text-align:right}
.buy{
  width:100%;height:46px;border-radius:15px;margin-bottom:8px;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:linear-gradient(100deg,#7c6cff,#39e6ff);color:#070b14;
  font-size:10.5px;font-weight:800;
  box-shadow:0 16px 34px -14px rgba(60,200,255,.7);transition:.2s;
}
.buy::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.4) 48%,transparent 62%);transform:translateX(-120%);animation:sheen 3.8s infinite}
.buy:hover{transform:translateY(-1px);box-shadow:0 20px 42px -14px rgba(60,200,255,.85)}
.buy:active{transform:scale(.99)}
.buy:disabled{opacity:.55;box-shadow:none;cursor:not-allowed;transform:none}
.ghost{
  width:100%;height:44px;border-radius:15px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);
  font-size:9.5px;font-weight:700;color:#dbe4f6;transition:.2s;
}
.ghost:hover{border-color:rgba(124,108,255,.42);background:rgba(124,108,255,.1)}
.ghost svg{width:13px;height:13px}
.small-note{font-size:6.9px;color:#5b647a;text-align:center;line-height:1.6}
.num-art{
  position:relative;height:168px;border-radius:22px;overflow:hidden;margin-bottom:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border:1px solid rgba(57,230,255,.2);
  background:
    radial-gradient(120% 120% at 82% 0%,rgba(57,230,255,.24),transparent 58%),
    radial-gradient(110% 110% at 0% 100%,rgba(124,108,255,.17),transparent 64%),
    #080f18;
}
.num-art::before,.num-art::after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(120,230,255,.12)}
.num-art::before{width:232px;height:232px;animation:spin 22s linear infinite}
.num-art::after{width:152px;height:152px;animation:spin 15s linear infinite reverse}
.num-art .kick{position:relative;z-index:2;font:700 6.4px var(--mono);letter-spacing:.26em;color:#77e5ff}
.num-art .big{
  position:relative;z-index:2;margin-top:9px;font-family:var(--mono);font-size:18.5px;font-weight:700;letter-spacing:-.05em;
  background:linear-gradient(100deg,#fff,#c6f8ff);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.num-art .sub{position:relative;z-index:2;margin-top:8px;font-size:6.3px;letter-spacing:.18em;color:#7f93b3}

/* toast */
.toast{
  position:absolute;left:50%;bottom:104px;z-index:70;max-width:300px;padding:10px 15px;border-radius:14px;
  background:rgba(20,24,36,.94);border:1px solid rgba(124,108,255,.38);
  box-shadow:0 18px 44px -10px rgba(0,0,0,.85);backdrop-filter:blur(14px);
  font-size:8.4px;font-weight:700;text-align:center;color:#e9f0ff;
  opacity:0;visibility:hidden;transform:translate(-50%,16px);transition:.3s;
}
.toast.show{opacity:1;visibility:visible;transform:translate(-50%,0)}

/* loader */
.loader{
  position:absolute;inset:0;z-index:80;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 82% at 50% 0%,#0c0d19 0%,#07080e 48%,#04050a 100%);
  transition:opacity .65s ease,transform .8s cubic-bezier(.22,1,.36,1),visibility .65s;
}
.loader::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(74% 54% at 50% 44%,transparent 38%,rgba(0,0,0,.6));
}
.ld-grid{
  position:absolute;left:-40%;right:-40%;top:-55%;bottom:-30%;opacity:.55;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:34px 34px;
  transform:perspective(460px) rotateX(62deg) translateY(4%);
  -webkit-mask-image:radial-gradient(58% 48% at 50% 46%,#000,transparent 76%);
  mask-image:radial-gradient(58% 48% at 50% 46%,#000,transparent 76%);
  animation:ldGrid 18s linear infinite;
}
.ld-center{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center}
.ld-mark{
  position:relative;width:118px;height:74px;display:grid;place-items:center;
  animation:ldMark 1.15s cubic-bezier(.22,1,.36,1) both;
}
.ld-mark img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 14px 30px rgba(0,0,0,.6))}
.ld-name{margin-top:21px;font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.52em;padding-left:.52em;color:#fff;animation:ldUp .8s .24s both}
.ld-tag{margin-top:9px;font:700 6.4px var(--font);letter-spacing:.42em;padding-left:.42em;color:#6a7288;animation:ldUp .8s .36s both}
.ld-foot{position:absolute;left:0;right:0;bottom:52px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 44px}
.ld-track{width:100%;height:2px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
.ld-track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#8ea2ff,#fff);box-shadow:0 0 12px rgba(186,208,255,.65)}
.ld-meta{display:flex;justify-content:space-between;width:100%;font:700 6.6px var(--mono);letter-spacing:.2em;color:#5c6478}
.ld-skip{margin-top:3px;font:700 6.2px var(--font);letter-spacing:.24em;text-transform:uppercase;color:#3f4759;animation:ldUp .9s .62s both}
.loader.done{opacity:0;visibility:hidden;transform:scale(1.03)}
@keyframes ldMark{from{opacity:0;transform:translateY(10px) scale(.94)}to{opacity:1;transform:none}}
@keyframes ldUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes ldGrid{from{background-position:0 0,0 0}to{background-position:0 34px,34px 0}}

/* ============ Gumroad · darker theme ============ */
body{background:#000}
body::before{
  background:
    radial-gradient(48% 38% at 50% 0%,rgba(92,74,214,.10),transparent 64%),
    radial-gradient(28% 32% at 88% 82%,rgba(40,205,255,.035),transparent 60%),
    radial-gradient(24% 26% at 6% 70%,rgba(160,70,220,.03),transparent 62%),
    #000;
}
body::after{background-image:linear-gradient(rgba(255,255,255,.013) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.013) 1px,transparent 1px)}
.stage::before{color:rgba(255,255,255,.012)}
.phone{
  background:linear-gradient(155deg,#191b23,#030407 46%,#11131a 100%);
  box-shadow:0 60px 140px -30px rgba(0,0,0,1),0 0 0 1px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.16);
}
.phone::before{opacity:.55}
.screen{background:#030306}
.bg .b1{background:#2a1a86;opacity:.26;filter:blur(70px)}
.bg .b2{background:#065c69;opacity:.14;filter:blur(72px)}
.bg .b3{background:#4a1470;opacity:.12;filter:blur(74px)}
.logo>img,.stage-brand img{filter:drop-shadow(0 4px 14px rgba(255,255,255,.14))}
.stage-brand img{filter:drop-shadow(0 8px 24px rgba(150,170,255,.22))}
.hero{
  background:linear-gradient(138deg,#0b0a14 0%,#070912 52%,#04060a 100%);
  border-color:rgba(255,255,255,.07);
  box-shadow:0 28px 60px -28px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.055);
}
.hero::before{opacity:.14}
.hero::after{background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.34) 58%,transparent 80%)}
.hero-art::before{background:radial-gradient(circle,rgba(57,230,255,.16),transparent 66%);filter:blur(16px)}
.hero-art img{box-shadow:0 22px 40px rgba(0,0,0,.75);filter:saturate(.95) brightness(.95)}
.cat{
  background:linear-gradient(160deg,var(--c1),rgba(255,255,255,.008));
  border-color:rgba(255,255,255,.06);
}
.cat-rent{--c1:rgba(124,108,255,.11);--c2:rgba(140,120,255,.16);--c3:rgba(140,120,255,.3)}
.cat-num{--c1:rgba(57,230,255,.065);--c2:rgba(57,230,255,.13);--c3:rgba(57,230,255,.26)}
.cat:hover{box-shadow:0 18px 34px -22px var(--c3)}
.cat-ico{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -12px var(--i2)}
.gift{
  background:linear-gradient(170deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
  border-color:rgba(255,255,255,.06);
}
.gift:hover{border-color:rgba(140,130,255,.32);box-shadow:0 18px 38px -22px rgba(90,80,255,.32)}
.search{background:rgba(255,255,255,.032)}
.stage-pill,.foot-pill{border-color:rgba(255,255,255,.07);background:rgba(255,255,255,.025)}
.tabbar{background:rgba(5,6,10,.88);border-color:rgba(255,255,255,.07);box-shadow:0 18px 40px -16px rgba(0,0,0,.95),inset 0 1px 0 rgba(255,255,255,.055)}
.sheet{background:linear-gradient(180deg,#101219,#07080d 42%);border-top-color:rgba(255,255,255,.1)}
.num-card{background:linear-gradient(165deg,var(--tone),rgba(255,255,255,.008))}
.me-card{background:linear-gradient(140deg,rgba(124,108,255,.13),rgba(57,230,255,.045) 56%,rgba(255,255,255,.02));border-color:rgba(255,255,255,.08)}
.club{background:linear-gradient(120deg,rgba(255,207,106,.1),rgba(255,106,168,.06));border-color:rgba(255,207,106,.18)}
.loader{background:radial-gradient(80% 60% at 50% 42%,#06070d,#000 72%)}
.loader::before{opacity:.5}
.loader-ring{border-color:rgba(255,255,255,.055)}
.loader-ring.r2{border-color:rgba(57,230,255,.07)}
.loader-word span{color:#5d6579}
.loader-skip{color:#3c4356}
.loader-meta{color:#525a6e}
.loader-bar{background:rgba(255,255,255,.06)}
.sheet-back{background:rgba(0,0,0,.72)}
.terms{background:rgba(255,255,255,.025)}
.num-head::selection{background:transparent}

/* ============ numbers header (compact, no broken preview) ============ */
.num-head{
  position:relative;margin:2px 0 16px;padding:15px 15px 13px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(255,255,255,.07);
  background:linear-gradient(150deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 62%,rgba(57,230,255,.03));
  box-shadow:0 22px 50px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05);
}
.num-head::before{
  content:"";position:absolute;width:210px;height:210px;right:-90px;top:-110px;border-radius:50%;
  background:radial-gradient(circle,rgba(57,230,255,.14),transparent 66%);filter:blur(10px);pointer-events:none;
}
.num-head h1{position:relative;z-index:2;margin-top:10px;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:-.055em;line-height:1.05}
.num-head h1 span{background:linear-gradient(100deg,#fff,#8fe9ff 62%,#7c6cff);-webkit-background-clip:text;background-clip:text;color:transparent}
.num-head p{position:relative;z-index:2;margin-top:7px;font-size:8.6px;line-height:1.55;color:#8d99b4;max-width:250px}
.num-stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.num-stats>div{padding-left:11px}
.num-stats>div:first-child{padding-left:0}
.num-stats>div+div{border-left:1px solid rgba(255,255,255,.06)}
.num-stats b{display:block;font-family:var(--mono);font-size:13px;font-weight:700;letter-spacing:-.04em}
.num-stats span{display:block;margin-top:3px;font-size:6.2px;letter-spacing:.1em;text-transform:uppercase;color:#6f7b96;font-weight:700}
.rent-head::before{background:radial-gradient(circle,rgba(124,108,255,.17),transparent 66%)}
.rent-head h1 span{
  background-image:linear-gradient(100deg,#fff,#d3c8ff 58%,#7c6cff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* ============ sell your gift ============ */
.sell-promo{
  position:relative;overflow:hidden;padding:14px;margin:0 0 16px;border-radius:20px;
  border:1px solid rgba(255,255,255,.09);
  background:linear-gradient(140deg,rgba(124,108,255,.14),rgba(57,230,255,.05) 58%,rgba(255,255,255,.02));
}
.sell-promo::after{
  content:"A";position:absolute;right:-10px;bottom:-40px;font:800 110px var(--display);font-style:italic;
  color:rgba(255,255,255,.045);pointer-events:none;
}
.sell-promo>b{position:relative;z-index:2;display:block;font-size:12px;font-weight:800;letter-spacing:-.02em}
.sell-promo>p{position:relative;z-index:2;font-size:8px;line-height:1.55;color:#95a1bb;margin:5px 0 12px;max-width:232px}
.sp-btn{
  position:relative;z-index:2;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;
  border-radius:11px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);
  font-size:9px;font-weight:800;color:#fff;transition:.2s;
}
.sp-btn svg{width:12px;height:12px}
.sp-btn:hover{background:rgba(255,255,255,.17)}
.steps{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
.step{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;border-radius:13px;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.026)}
.step i{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none;background:rgba(57,230,255,.11);border:1px solid rgba(57,230,255,.18);color:#8beaff;font:700 9px var(--mono);font-style:normal}
.step b{display:block;font-size:9px;font-weight:700}
.step small{display:block;font-size:7.4px;color:#7d89a4;margin-top:2px;line-height:1.5}
.holder-chip{
  display:flex;align-items:center;gap:8px;padding:9px 11px;margin-bottom:13px;border-radius:12px;
  border:1px solid rgba(57,230,255,.2);background:rgba(57,230,255,.065);
  font:700 9.6px var(--mono);color:#b9f4ff;letter-spacing:-.02em;
}
.holder-chip svg{width:14px;height:14px;flex:none;color:#8beaff}
.holder-chip button{
  margin-left:auto;padding:5px 7px;border-radius:7px;background:rgba(255,255,255,.08);
  font:700 6.6px var(--font);letter-spacing:.08em;color:#dff8ff;text-transform:uppercase;
}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:9px}
.field>label,.field span.lbl{font-size:6.6px;letter-spacing:.15em;text-transform:uppercase;color:#75809b;font-weight:800}
.field input,.field select{
  width:100%;height:40px;padding:0 11px;border-radius:12px;outline:0;
  border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.32);
  color:var(--text);font-size:10px;font-weight:600;
}
.field input:focus,.field select:focus{border-color:rgba(57,230,255,.4);box-shadow:0 0 0 3px rgba(57,230,255,.06)}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7c8aa8 50%),linear-gradient(135deg,#7c8aa8 50%,transparent 50%);background-position:calc(100% - 15px) 18px,calc(100% - 10px) 18px;background-size:5px 5px;background-repeat:no-repeat}
.field .hint{font-size:7px;color:#69748f;margin-top:2px}
.field-row{display:flex;gap:7px}
.field-row .field{flex:1}

/* ============ wallet ============ */
.wallet-card{
  position:relative;overflow:hidden;padding:16px;border-radius:20px;margin-bottom:12px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(140deg,rgba(124,108,255,.14),rgba(57,230,255,.05) 60%,rgba(255,255,255,.02));
}
.wallet-card::before{content:"";position:absolute;width:200px;height:200px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,rgba(57,230,255,.18),transparent 68%);filter:blur(10px)}
.wallet-card>span{position:relative;z-index:2;font-size:6.6px;letter-spacing:.18em;text-transform:uppercase;color:#8b97b2;font-weight:700}
.wallet-card b{position:relative;z-index:2;display:block;margin-top:5px;font-family:var(--mono);font-size:27px;font-weight:700;letter-spacing:-.06em;background:linear-gradient(100deg,#fff,#9fe9ff 60%,#6fffd6);-webkit-background-clip:text;background-clip:text;color:transparent}
.wallet-card b i{font-style:normal;font-size:9px;letter-spacing:.14em;-webkit-text-fill-color:#8fa3c8;margin-left:2px}
.wallet-card small{position:relative;z-index:2;display:block;margin-top:5px;font-size:7.2px;color:#7de8c0;font-weight:600}
.wallet-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
.wallet-btn{height:43px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:9.4px;font-weight:800;transition:.18s;border:1px solid transparent}
.wallet-btn svg{width:13px;height:13px}
.wallet-btn.primary{background:linear-gradient(100deg,#7c6cff,#39e6ff);color:#05080f;box-shadow:0 14px 30px -16px rgba(60,200,255,.7)}
.wallet-btn.secondary{border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#e6edfc}
.wallet-btn:hover{transform:translateY(-1px)}
.wallet-btn:active{transform:scale(.99)}
.wallet-ops{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.w-op{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.055);background:rgba(255,255,255,.025)}
.w-op .wi{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.05);color:#a9b6d2}
.w-op .wi svg{width:12px;height:12px}
.w-op b{display:block;font-size:9px;font-weight:700}
.w-op small{display:block;font-size:6.8px;color:#6f7a94;margin-top:2px}
.w-op .sum{margin-left:auto;font:700 9.5px var(--mono);letter-spacing:-.02em}
.w-op .sum.minus{color:#ff9f9f}
.w-op .sum.plus{color:#7ff0c4}
.amount-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-bottom:11px}
.amount{padding:11px 10px;border-radius:12px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.03);font:700 12px var(--mono);letter-spacing:-.03em;text-align:left;transition:.18s;color:#dfe7f7}
.amount small{display:block;margin-top:2px;font:600 6.4px var(--font);letter-spacing:.1em;color:#6f7a94;text-transform:uppercase}
.amount.on{border-color:rgba(57,230,255,.45);background:rgba(57,230,255,.09);box-shadow:0 0 0 3px rgba(57,230,255,.05)}
.pay-hint{margin:0 0 11px;font-size:7.4px;line-height:1.5;color:#7f8ba6;text-align:center}
.pay-box{display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;border-radius:13px;border:1px solid rgba(57,230,255,.18);background:rgba(57,230,255,.05)}
.pay-box .pb-ico{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:rgba(57,230,255,.1);border:1px solid rgba(57,230,255,.22);color:#8beaff}
.pay-box .pb-ico svg{width:15px;height:15px}
.pay-box b{display:block;font-size:9.4px;font-weight:700}
.pay-box small{display:block;font-size:7.2px;color:#7d89a4;margin-top:2px}
.pay-note{margin-top:9px;font-size:6.8px;line-height:1.55;color:#5b6479;text-align:center}

/* touch ripple */
.tap{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(255,255,255,.28);pointer-events:none;z-index:9;animation:tapOut .55s ease-out forwards}
@keyframes tapOut{from{transform:scale(0);opacity:.7}to{transform:scale(14);opacity:0}}
button{position:relative;overflow:hidden}
.gift .fav{overflow:visible}

/* ============ dark polish ============ */
/* primary actions: dark glass instead of neon */
.buy,.wallet-btn.primary{
  background:linear-gradient(135deg,rgba(133,126,255,.34),rgba(57,230,255,.16) 62%,rgba(93,242,184,.12));
  border:1px solid rgba(160,168,255,.36);
  color:#f6f8ff;
  box-shadow:0 20px 40px -24px rgba(90,90,220,.75),inset 0 1px 0 rgba(255,255,255,.18);
}
.buy::after{opacity:.3}
.buy:hover,.wallet-btn.primary:hover{border-color:rgba(180,188,255,.5);box-shadow:0 24px 46px -22px rgba(100,100,240,.85),inset 0 1px 0 rgba(255,255,255,.22)}
.term.on{
  background:rgba(255,255,255,.085);
  color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.1);
}
.term.on b{background:rgba(255,255,255,.14);color:#a9f4ff}
.cat-rent{--c1:rgba(124,108,255,.085);--c2:rgba(140,120,255,.12);--c3:rgba(140,120,255,.22)}
.cat-num{--c1:rgba(57,230,255,.05);--c2:rgba(57,230,255,.1);--c3:rgba(57,230,255,.2)}
.gift-art img{filter:saturate(.92) brightness(.93)}
.gift:hover .gift-art img{filter:saturate(1) brightness(1)}
.hero-art img{filter:saturate(.9) brightness(.9)}
.num-card{background:linear-gradient(165deg,var(--tone),rgba(255,255,255,.006) 62%,rgba(0,0,0,.15))}
.num-card::before{border-color:rgba(120,220,255,.09)}
.num-card::after{border-color:rgba(120,220,255,.06)}
.num-card:hover{box-shadow:0 16px 32px -20px rgba(57,230,255,.28)}
.gift-foot{gap:6px}
.rent-min{font-size:6.9px;letter-spacing:.01em;color:#7d89a6}

/* mobile press states */
@media (hover:none){
  .gift:hover{transform:none;box-shadow:none;border-color:rgba(255,255,255,.06)}
  .gift:hover .gift-art img{scale:none;filter:none}
  .cat:hover{box-shadow:none}
  .cat:active,.gift:active,.num-card:active,.m-row:active,.sp-btn:active,.tab:active{transform:scale(.975)}
  .cat:active{transform:scale(.985)}
}
.cat,.num-card,.m-row,.tab,.term,.wallet-btn{transition:transform .18s cubic-bezier(.22,1,.36,1),border-color .2s,box-shadow .2s,background .2s,color .2s}
.tab.on svg{animation:tabPop .42s cubic-bezier(.22,1.4,.36,1)}
@keyframes tabPop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.sheet>*{transition:opacity .2s}
.bal:active{transform:scale(.96)}
.num-val{text-shadow:0 1px 12px rgba(0,0,0,.5)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  .gift,.num-card{opacity:1 !important;transform:none !important}
}

/* keyframes */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(26px,-22px,0) scale(1.14)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(var(--r,0deg))}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes pageIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes tabIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pulseRing{0%{transform:scale(.92);opacity:.75}100%{transform:scale(1.32);opacity:0}}
@keyframes sheen{0%,58%{transform:translateX(-120%)}92%,100%{transform:translateX(120%)}}
@keyframes markIn{from{opacity:0;transform:scale(.55) rotate(-9deg);filter:blur(12px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
}
@media (max-width:900px){
  html,body{background:var(--screen);height:100%}
  .stage{padding:0;min-height:100vh;min-height:100dvh;width:100%}
  .stage-brand,.stage-pill,.stage-foot{display:none}
  .stage::before{display:none}
  .phone{padding:0;border-radius:0;background:none;box-shadow:none;transform:none;width:100%}
  .phone::before{display:none}
  .screen{width:100vw;height:100vh;height:100dvh;border-radius:0;box-shadow:none}
  .screen::after{display:none}
  .statusbar,.island{display:none}
  .topbar{padding-top:calc(12px + env(safe-area-inset-top))}
  .tabbar{bottom:calc(12px + env(safe-area-inset-bottom))}
  .view{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
  .sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
}

const GEM_IMG = '<img class="gem-ico" src="assets/gem.svg" alt="GRAM">';

/* ============ data ============ */
const FEATURED = ['Eternal Rose','Diamond Ring','Crystal Ball','Bunny Muffin','Chill Flame','Bling Binky','Astral Shard','Candy Cane',"Durov's Cap",'Heart Locket','Witch Hat'];
const LOTS = Array.isArray(window.ATLANTA_MARKET) ? window.ATLANTA_MARKET : [];
const META = window.ATLANTA_META || { total: LOTS.length, collections: 0, currency: 'GRAM' };

/* Round-robin by collection: keeps the feed varied instead of 70 roses in a row. */
const GIFTS = (() => {
  const groups = new Map();
  for (const lot of LOTS) {
    if (!groups.has(lot.name)) groups.set(lot.name, []);
    groups.get(lot.name).push(lot);
  }
  const names = [...groups.keys()].sort((a, b) => {
    const ia = FEATURED.indexOf(a), ib = FEATURED.indexOf(b);
    const pa = ia < 0 ? 99 : ia, pb = ib < 0 ? 99 : ib;
    if (pa !== pb) return pa - pb;
    return groups.get(b)[0].price - groups.get(a)[0].price;
  });
  const out = [];
  let more = true;
  while (more) {
    more = false;
    for (const name of names) {
      const arr = groups.get(name);
      if (arr.length) { out.push(arr.shift()); more = true; }
    }
  }
  return out;
})();
const BY_ID = new Map(GIFTS.map(g => [g.id, g]));

const MIN_RENT = GIFTS.reduce((m, g) => Math.min(m, g.rent), Infinity);

const SYM_GLYPHS = ['✦', '❖', '✧', '◆', '✺', '☘', '⚜', '❄', '✵', '✷', '✹', '✶', '❋', '✿', '⚝', '❃'];
const hashStr = s => {
  let h = 2166136261;
  s = String(s || '');
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return Math.abs(h);
};
const glyphOf = s => SYM_GLYPHS[hashStr(s) % SYM_GLYPHS.length];
const artOf = g => g.image;

/* Separate feeds: a collection goes either to the market or to rent,
   so the same gift never appears in both ribbons. */
const FEED_POOLS = (() => {
  const seen = new Set();
  const unique = GIFTS.filter(g => {
    const key = g.slug || g.name;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
  const sale = [], rent = [];
  unique.forEach((g, i) => (i % 2 ? rent : sale).push(g));
  return { sale, rent };
})();

function updateBalanceUI() {
  document.querySelectorAll('[data-balance]').forEach(el => el.textContent = num(wallet.balance));
}

/* Server API: the same FastAPI process serves the market and verifies initData. */
const tgInitData = () => (tg && tg.initData) || '';

function apiHeaders(extra) {
  const h = Object.assign({ 'Accept': 'application/json' }, extra || {});
  const init = tgInitData();
  if (init) h['X-Telegram-Init-Data'] = init;
  return h;
}

async function api(path, opts = {}) {
  const res = await fetch('/api/market' + path, Object.assign({}, opts, { headers: apiHeaders(opts.headers) }));
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) {
    const detail = data && data.detail;
    const msg = (data && (data.message || data.error)) || (typeof detail === 'string' ? detail : '') || ('HTTP ' + res.status);
    const err = new Error(msg);
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

function applyMe(data) {
  wallet.balance = Number(data.balance) || 0;
  wallet.pending = Number(data.pending) || 0;
  wallet.ops = Array.isArray(data.ops) ? data.ops : [];
  if (data.user) marketUser = data.user;
  if (window.AtlantaOrders) window.AtlantaOrders.items = Array.isArray(data.orders) ? data.orders : [];
  updateBalanceUI();
}

async function refreshMe() {
  try {
    const data = await api('/me');
    applyMe(data);
    return data;
  } catch (err) {
    return null;
  }
}

async function loadMarketConfig() {
  try {
    const res = await fetch('/api/market/config', { headers: { 'Accept': 'application/json' } });
    if (res.ok) marketConfig = Object.assign(marketConfig, await res.json());
  } catch (err) {}
}

async function startTopup(amount) {
  return api('/topup', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ amount })
  });
}

async function fetchMe() { return api('/me'); }

function waitTopup() {
  const start = wallet.balance;
  let tries = 0;
  const tick = async () => {
    tries++;
    try {
      const data = await fetchMe();
      if (typeof data.balance === 'number' && data.balance > start) {
        applyMe(data);
        closeSheet();
        haptic('medium');
        toast('Баланс пополнен');
        render();
        return;
      }
    } catch (err) {}
    if (tries < 40) setTimeout(tick, 3000);
    else toast('Платёж ещё не подтверждён');
  };
  setTimeout(tick, 2500);
}

let hapticTimer = 0;
function haptic(kind = 'light') {
  try {
    if (!tg || !tg.HapticFeedback) return;
    if (kind === 'error') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred(kind);
  } catch (e) {}
}

const TERMS = { 1: { label: '1 месяц', short: 'за месяц', disc: 1 }, 3: { label: '3 месяца', short: 'за 3 мес', disc: .95 }, 6: { label: '6 месяцев', short: 'за 6 мес', disc: .9 } };
const SORT_LABEL = { curated: 'Подборка', asc: 'Цена ↑', desc: 'Цена ↓' };

const state = {
  tab: 'store', query: '', term: 1, sort: 'curated', limit: 24, deposit: 10,
  collection: '', model: '', backdrop: '', symbol: '',
  favs: (() => { try { return new Set(JSON.parse(localStorage.getItem('atlanta-market:favs:v1') || '[]')); } catch (e) { return new Set(); } })()
};
let chipsOpen = false;

/* ============ helpers ============ */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = n => Number(n || 0).toLocaleString('ru-RU', { maximumFractionDigits: 2 });
const plural = (n, forms) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return forms[2];
  if (b > 1 && b < 5) return forms[1];
  if (b === 1) return forms[0];
  return forms[2];
};

const orderJson = obj => esc(JSON.stringify(obj));

function termTotal(g) { return Math.round(g.rent * state.term * TERMS[state.term].disc * 100) / 100; }
function numTermTotal(n) { return Math.round(n.rent * state.term * TERMS[state.term].disc * 100) / 100; }

function filtered(kind = 'sale') {
  const q = state.query.trim().toLowerCase();
  let base;
  if (q || state.collection) {
    base = GIFTS.filter(g => !q || (g.name + ' ' + g.model + ' ' + g.backdrop + ' ' + g.symbol + ' ' + g.num).toLowerCase().includes(q));
    if (state.collection) base = base.filter(g => g.name === state.collection);
  } else {
    base = kind === 'rent' ? FEED_POOLS.rent : FEED_POOLS.sale;
  }
  if (state.collection) {
    if (state.model) base = base.filter(g => g.model === state.model);
    if (state.backdrop) base = base.filter(g => g.backdrop === state.backdrop);
    if (state.symbol) base = base.filter(g => g.symbol === state.symbol);
  }
  let list = base;
  if (state.sort === 'asc') list = list.slice().sort((a, b) => a.price - b.price);
  else if (state.sort === 'desc') list = list.slice().sort((a, b) => b.price - a.price);
  return list;
}

const sortNames = arr => [...new Set(arr.filter(Boolean))].sort((a, b) => a.localeCompare(b));
const COLLECTIONS = sortNames(GIFTS.map(g => g.name));
const collectionPool = () => state.collection ? GIFTS.filter(g => g.name === state.collection) : [];
const optionsFor = field => sortNames(collectionPool().map(g => g[field]));

function chipsHTML() {
  const kind = state.tab === 'rent' ? 'rent' : 'sale';
  const narrowed = !!state.query.trim() || !!state.collection || !!state.model || !!state.backdrop || !!state.symbol;
  const total = narrowed ? filtered(kind).length : (kind === 'rent' ? FEED_POOLS.rent.length : LOTS.length);
  const chevron = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`;
  const sel = (key, label, arr) => {
    const active = !!state[key];
    return `<label class="chip ${active ? 'on' : ''}">
      <span>${active ? esc(state[key]) : label}</span>
      ${chevron}
      <select data-f="${key}" aria-label="${esc(label)}">
        <option value="">${esc(label)}: все</option>
        ${arr.map(v => `<option value="${esc(v)}" ${state[key] === v ? 'selected' : ''}>${esc(v)}</option>`).join('')}
      </select>
    </label>`;
  };
  const locked = label => `<button type="button" class="chip chip-locked" data-need-collection aria-label="${esc(label)}">
      <span>${label}</span>${chevron}
    </button>`;
  const fields = state.collection
    ? `${sel('model', 'Модель', optionsFor('model'))}${sel('backdrop', 'Фон', optionsFor('backdrop'))}${sel('symbol', 'Узор', optionsFor('symbol'))}`
    : `${locked('Модель')}${locked('Фон')}${locked('Узор')}`;
  const reset = (state.collection || state.model || state.backdrop || state.symbol)
    ? `<button class="chip chip-reset" data-reset-f>Сбросить</button>`
    : '';
  return `${sel('collection', 'Коллекция', COLLECTIONS)}${fields}${reset}<span class="chip-count">${num(total)} шт.</span>`;
}

};
