<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLANTA — маркет подарков Telegram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070910;
  --screen:#0c0f16;
  --panel:#161a22;
  --panel-2:#1c212b;
  --line:rgba(255,255,255,.075);
  --line-2:rgba(255,255,255,.14);
  --text:#f5f7fb;
  --muted:#9098aa;
  --blue:#5b8cff;
  --blue-2:#8ab4ff;
  --cyan:#6fd7ff;
  --mint:#79dfb6;
  --grad:linear-gradient(135deg,#4f86ff,#6fd7ff);
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --display:"Unbounded","Manrope",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ---------- showcase ---------- */
.stage{
  position:relative;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:28px 24px 56px;
  overflow:hidden;
  background:
    radial-gradient(900px 520px at 18% -10%, rgba(47,125,255,.18), transparent 62%),
    radial-gradient(760px 520px at 88% 12%, rgba(53,214,255,.10), transparent 60%),
    radial-gradient(900px 700px at 50% 118%, rgba(120,72,255,.14), transparent 62%),
    #07080b;
}
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 40%,#000 25%,transparent 78%);
}
.stage::after{
  content:"";position:absolute;left:50%;top:48%;width:720px;height:720px;transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(47,125,255,.22),rgba(53,214,255,.06) 45%,transparent 68%);
  filter:blur(30px);pointer-events:none;
}
.ghost-word{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font-family:var(--display);font-weight:700;font-size:clamp(120px,19vw,300px);letter-spacing:.02em;
  color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.055);
  pointer-events:none;white-space:nowrap;user-select:none;
}
.show-head{
  position:relative;z-index:3;width:100%;max-width:1180px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  margin-bottom:26px;
}
.show-brand{display:flex;align-items:center;gap:13px}
.show-brand .mark{width:42px;height:42px;filter:drop-shadow(0 0 16px rgba(47,125,255,.55))}
.show-brand b{display:block;font-family:var(--display);font-size:17px;letter-spacing:.22em;font-weight:600}
.show-brand span{display:block;font-size:10px;letter-spacing:.26em;color:var(--muted);margin-top:3px}
.head-pill{
  display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
  border:1px solid var(--line-2);background:rgba(255,255,255,.035);backdrop-filter:blur(8px);
  font-size:11.5px;font-weight:600;color:#cfd6e6;
}
.head-pill i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 10px var(--mint)}
.phone-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:22px}

/* ---------- phone ---------- */
.phone{
  position:relative;width:390px;height:844px;flex:none;
  border-radius:56px;
  padding:11px;
  background:linear-gradient(160deg,#3a3f4a,#0c0d11 38%,#05060a 70%,#2a2e37);
  box-shadow:
    0 0 0 1px rgba(255,255,255,.09),
    0 40px 90px rgba(0,0,0,.72),
    0 0 90px rgba(47,125,255,.20),
    inset 0 0 0 1px rgba(0,0,0,.6);
}
.phone::after{
  content:"";position:absolute;inset:-2px;border-radius:58px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.16),transparent 28%,transparent 70%,rgba(255,255,255,.08));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;padding:1px;
}
.screen{
  position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;
  background:var(--screen);
  isolation:isolate;
}
.island{
  position:absolute;z-index:60;top:22px;left:50%;transform:translateX(-50%);
  width:112px;height:30px;border-radius:18px;background:#000;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.04);
}
.island::after{content:"";position:absolute;right:13px;top:10px;width:9px;height:9px;border-radius:50%;background:#0e1420;box-shadow:inset 0 0 2px rgba(80,140,255,.5)}

/* status bar */
.statusbar{
  position:relative;z-index:50;height:50px;display:flex;align-items:flex-end;justify-content:space-between;
  padding:0 27px 6px;font-size:13px;font-weight:700;letter-spacing:.02em;
}
.status-icons{display:flex;align-items:center;gap:6px}
.status-icons svg{display:block}

/* telegram chrome */
.tgbar{
  position:relative;z-index:50;height:42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;
  background:linear-gradient(180deg,rgba(11,12,16,.94),rgba(11,12,16,.78));
  border-bottom:1px solid rgba(255,255,255,.045);
  backdrop-filter:blur(14px);
}
.tgbar .ic-btn{
  width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.06);color:#dfe5f0;
  display:grid;place-items:center;cursor:pointer;transition:.15s;
}
.tgbar .ic-btn:hover{background:rgba(255,255,255,.12)}
.tg-title{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;letter-spacing:.02em}
.tg-title em{font-style:normal;color:var(--muted);font-weight:500}
.verified{width:13px;height:13px;color:var(--blue-2)}

/* scroll view */
.view{
  position:absolute;inset:92px 0 0;overflow-y:auto;overflow-x:hidden;
  padding:14px 15px 112px;
  scrollbar-width:none;
  overscroll-behavior:contain;
}
.view::-webkit-scrollbar{display:none}
.screen::before{
  content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(420px 260px at 12% 0%, rgba(47,125,255,.16), transparent 65%),
    radial-gradient(360px 300px at 92% 26%, rgba(53,214,255,.08), transparent 68%),
    radial-gradient(300px 260px at 50% 100%, rgba(130,80,255,.10), transparent 70%);
}

/* top bar inside app */
.app-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 14px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .mark{width:30px;height:30px;flex:none;filter:drop-shadow(0 0 10px rgba(61,139,255,.45))}
.brand-name{font-family:var(--display);font-size:14.5px;font-weight:600;letter-spacing:.19em;line-height:1}
.brand-sub{font-size:8.5px;letter-spacing:.22em;color:var(--muted);margin-top:4px;font-weight:600}
.head-actions{display:flex;align-items:center;gap:7px}
.balance{
  display:flex;align-items:center;gap:6px;height:32px;padding:0 11px 0 8px;border-radius:999px;
  border:1px solid rgba(61,139,255,.34);
  background:linear-gradient(180deg,rgba(61,139,255,.20),rgba(61,139,255,.07));
  color:#fff;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap;
  box-shadow:0 0 18px rgba(61,139,255,.12);
}
.balance .diamond{
  width:17px;height:17px;border-radius:5px;background:var(--grad);display:grid;place-items:center;
  font-size:8px;color:#04121f;box-shadow:0 0 10px rgba(53,214,255,.45);
}
.balance small{color:#9fc4ff;font-weight:600;font-size:9.5px;letter-spacing:.04em}
.avatar{
  width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.18);
  background:linear-gradient(135deg,#3b7dff,#8a5cff);color:#fff;font-size:12px;font-weight:800;
  display:grid;place-items:center;cursor:pointer;
}
.back-btn{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);
  background:rgba(255,255,255,.05);color:#dbe2ef;font-size:20px;line-height:1;
  display:grid;place-items:center;cursor:pointer;font-family:inherit;
  transition:background .16s var(--ease),border-color .16s var(--ease);
}
.back-btn:hover{background:rgba(255,255,255,.09);border-color:var(--line-2)}

/* search */
.search-row{display:flex;gap:8px;margin-bottom:12px}
.search{
  flex:1;height:44px;border-radius:15px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  display:flex;align-items:center;gap:9px;padding:0 12px;transition:border-color .18s var(--ease),background .18s var(--ease),box-shadow .18s var(--ease);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.search:focus-within{border-color:rgba(91,140,255,.55);background:rgba(91,140,255,.07);box-shadow:0 0 0 3px rgba(91,140,255,.10)}
.search svg{color:#7f8798;flex:none}
.search input{
  width:100%;border:0;outline:0;background:transparent;color:var(--text);
  font:500 13px/1 var(--font);letter-spacing:.01em;
}
.search input::placeholder{color:#6f7688}
.filter-btn{
  position:relative;width:44px;height:44px;border-radius:15px;flex:none;cursor:pointer;
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:#d5dbe8;display:grid;place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
  transition:border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease);
}
.filter-btn:hover{background:rgba(255,255,255,.07)}
.filter-btn.on{border-color:rgba(120,165,255,.42);background:rgba(91,140,255,.13);color:#fff}
.filter-btn .dot{position:absolute;top:9px;right:10px;width:5px;height:5px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}

/* hero */
.hero{
  position:relative;border-radius:24px;overflow:hidden;isolation:isolate;
  padding:18px 16px 16px;margin-bottom:16px;min-height:182px;
  border:1px solid rgba(120,165,255,.18);
  background:
    linear-gradient(100deg,rgba(7,10,16,.94),rgba(7,10,16,.54) 72%),
    radial-gradient(130% 130% at 100% 0%,var(--c,#899288),var(--e,#5e6b63) 72%);
  box-shadow:0 18px 42px rgba(5,12,30,.5), inset 0 1px 0 rgba(255,255,255,.09);
}
.hero::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;opacity:.22;
  background:
    repeating-linear-gradient(135deg,transparent 0 18px,var(--p,#1c261f) 18px 19px),
    radial-gradient(circle at 84% 18%,var(--p,#1c261f),transparent 62%);
}
.hero-copy{position:relative;z-index:3;width:63%}
.hero-eyebrow{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.14);
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#dce9ff;
  backdrop-filter:blur(6px);
}
.hero-eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}
.hero h1{
  margin:10px 0 7px;font-size:21px;line-height:1.12;letter-spacing:-.03em;font-weight:800;
  text-wrap:balance;
}
.hero h1 span{background:linear-gradient(100deg,#fff,#b5d9ff 60%,#8ee9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-size:10.5px;line-height:1.5;color:#b2c7e8;max-width:184px;font-weight:500}
.hero-btn{
  margin-top:13px;height:33px;padding:0 14px;border:0;border-radius:12px;cursor:pointer;
  background:#eef6ff;color:#0a1530;font:800 11px/1 var(--font);letter-spacing:.01em;
  display:inline-flex;align-items:center;gap:6px;
  box-shadow:0 8px 20px rgba(0,10,30,.32);
}
.hero-btn{transition:background .18s var(--ease),box-shadow .18s var(--ease)}
.hero-btn:hover{background:#fff;box-shadow:0 10px 24px rgba(0,10,30,.38)}
.hero-art{position:absolute;inset:0;z-index:2;pointer-events:none}
.hero-art img{
  position:absolute;object-fit:contain;filter:drop-shadow(0 14px 18px rgba(0,0,0,.55));
}
.hero-art .art-symbol{
  inset:0;width:100%;height:100%;object-fit:cover;filter:none;opacity:.12;z-index:1;
}
.hero-art .g1{width:104px;height:104px;right:58px;top:20px;transform:rotate(-10deg);z-index:4}
.hero-art .g2{width:88px;height:88px;right:2px;top:58px;transform:rotate(12deg);z-index:3}
.hero-art .g3{width:70px;height:70px;right:104px;bottom:-6px;transform:rotate(-4deg);z-index:2;opacity:.9}

/* section head */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 1px 9px}
.sec-head h2{margin:0;font-size:14px;font-weight:800;letter-spacing:-.01em}
.sec-head .count{color:var(--muted);font-size:10.5px;font-weight:600;margin-left:5px}
.link-btn{
  border:0;background:transparent;color:#9dc2ff;font:700 10.5px/1 var(--font);cursor:pointer;
  display:flex;align-items:center;gap:3px;padding:4px 0;
}

/* collections */
.collections{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;margin:0 -15px 18px;padding:0 15px 2px}
.collections::-webkit-scrollbar{display:none}
.coll-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.coll-grid .coll{width:auto}
.coll{
  flex:none;width:132px;border-radius:19px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:linear-gradient(180deg,#191d26,#12151c);
  transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
  text-align:left;padding:0;color:inherit;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.coll:hover{border-color:rgba(120,165,255,.42);background:linear-gradient(180deg,#1c212b,#141821)}
.coll-art{
  position:relative;height:92px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(120% 110% at 50% 8%,var(--c,#899288),var(--e,#5e6b63) 74%);
}
.coll-art::before{
  content:"";position:absolute;inset:0;z-index:0;opacity:.24;
  background:
    repeating-linear-gradient(135deg,transparent 0 14px,var(--p,#1c261f) 14px 15px),
    radial-gradient(circle at 20% 82%,var(--p,#1c261f),transparent 58%);
}
.coll-art::after{content:"";position:absolute;inset:auto 12% 8px;height:11px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(7px);z-index:1}
.coll-art .art-symbol{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.16;z-index:1;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.coll-art > img.model-img{width:76px;height:76px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 8px 10px rgba(0,0,0,.5))}
.coll-art .badge{position:absolute;z-index:3;left:8px;top:8px}
.coll-body{padding:9px 10px 11px}
.coll-body b{display:block;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coll-meta{display:flex;align-items:center;justify-content:space-between;margin-top:5px;gap:6px}
.coll-price{font-size:10.5px;font-weight:800}
.coll-price small{font-size:8px;color:var(--muted);font-weight:600;margin-right:2px}
.coll-price em{font-size:7px;color:#9fb4d6;font-style:normal;font-weight:700;letter-spacing:.04em}
.coll-delta{font-size:9px;font-weight:700;color:var(--mint)}
.coll-delta.down{color:#ff7a8a}

/* badge */
.badge{
  display:inline-flex;align-items:center;height:16px;padding:0 6px;border-radius:5px;
  font-size:7.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(75,227,163,.16);color:#7bf0bb;border:1px solid rgba(75,227,163,.28);
  backdrop-filter:blur(4px);
}
.badge.hot{background:rgba(255,94,125,.16);color:#ff9db0;border-color:rgba(255,94,125,.30)}
.badge.blue{background:rgba(61,139,255,.18);color:#a8ccff;border-color:rgba(61,139,255,.32)}

/* gift grid */
.gift-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
body.compact .gift-grid{gap:6px}
body.compact .gift-art{height:112px}
body.compact .gift-art img{width:80px;height:80px}
.gift{
  position:relative;border-radius:20px;overflow:hidden;cursor:pointer;text-align:left;color:inherit;
  border:1px solid var(--line);background:linear-gradient(180deg,#181c24,#10131a);
  transition:border-color .2s var(--ease),background .2s var(--ease),box-shadow .2s var(--ease);
  padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
}
.gift:hover{border-color:rgba(120,165,255,.42);background:linear-gradient(180deg,#1b202a,#121620);box-shadow:0 12px 26px rgba(0,0,0,.38)}
.gift:active{border-color:rgba(120,165,255,.55)}
.gift-art{
  position:relative;height:124px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(130% 120% at 50% 6%,var(--c,#899288),var(--e,#5e6b63) 74%);
}
.gift-art::before{
  content:"";position:absolute;inset:0;z-index:0;opacity:.26;
  background:
    repeating-linear-gradient(135deg,transparent 0 15px,var(--p,#1c261f) 15px 16px),
    radial-gradient(circle at 18% 82%,var(--p,#1c261f),transparent 58%);
}
.gift-art .art-symbol{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:.18;z-index:1;pointer-events:none;filter:drop-shadow(0 6px 12px rgba(0,0,0,.6))}
.gift-art > img.model-img{width:94px;height:94px;object-fit:contain;position:relative;z-index:2;filter:drop-shadow(0 10px 14px rgba(0,0,0,.5))}
.gift-art .badge{position:absolute;z-index:3;top:8px;left:8px}
.fav{
  position:absolute;z-index:3;right:7px;top:7px;width:22px;height:22px;border-radius:50%;
  border:1px solid rgba(255,255,255,.14);background:rgba(10,12,16,.55);backdrop-filter:blur(6px);
  color:#c6cfdf;display:grid;place-items:center;cursor:pointer;transition:color .15s var(--ease),border-color .15s var(--ease),background .15s var(--ease);
}
.fav:hover{color:#ff7a94;border-color:rgba(255,122,148,.5)}
.gift-body{padding:9px 10px 11px}
.gift-name{font-size:11.5px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-model{font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gift-price{display:flex;align-items:center;gap:4px;margin-top:8px}
.gift-price b{
  display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:9px;
  background:rgba(91,140,255,.12);border:1px solid rgba(111,215,255,.14);
  font-size:11px;font-weight:800;letter-spacing:-.01em;
}
.gift-price b span{font-size:8px;color:#a9c8ff;font-weight:700;margin-left:3px}
.gram,
.gift-price b span.gram,
.coll-price em.gram,
.sheet-row b .gram,
.stat b.gram{
  font-family:var(--display);font-size:8px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;font-style:normal;
  background:linear-gradient(100deg,#d8e9ff,#8ee9ff 62%,#a8f0d0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.gift-price b span.gram{margin-left:3px}
.coll-price em.gram{font-size:7px;letter-spacing:.06em}
.sheet-row b .gram{font-size:9px;margin-left:2px}
.stat b.gram{font-size:12px;letter-spacing:.1em}

/* empty */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:46px 24px;color:var(--muted);gap:10px;
}
.empty .ring{
  width:62px;height:62px;border-radius:22px;display:grid;place-items:center;
  background:rgba(91,140,255,.10);border:1px solid rgba(120,165,255,.22);color:#9dc2ff;
}
.empty b{color:var(--text);font-size:13px}
.empty p{margin:0;font-size:10.5px;line-height:1.5;max-width:210px}

/* tab bar */
.tabbar{
  position:absolute;z-index:55;left:10px;right:10px;bottom:10px;height:66px;border-radius:23px;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(17,20,28,.92);border:1px solid rgba(255,255,255,.09);
  backdrop-filter:blur(22px) saturate(140%);
  box-shadow:0 16px 38px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.10);
}
.tab{

<script>
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) return;
  document.body.classList.add('miniapp');
  if (tg.setHeaderColor) tg.setHeaderColor('#0c0f16');
  if (tg.setBackgroundColor) tg.setBackgroundColor('#0c0f16');
  if (tg.expand) tg.expand();
  if (tg.ready) tg.ready();
})();

const norm = (s) => String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const FLOORS = Object.fromEntries((window.ATLANTA_FLOORS || []).map(g => [norm(g.name), g]));
const TINTS = ['#ff5d8f','#4be3a3','#a78bfa','#ffb35c','#ff9ac6','#7dd3fc','#f472b6','#818cf8','#34d399','#60a5fa'];
const DECOR = window.ATLANTA_DECOR || {};
const GIFTS = (window.ATLANTA_CATALOG || window.ATLANTA_FLOORS || []).map((g, i) => {
  const f = FLOORS[norm(g.name)] || {};
  return {
    ...g, ...f,
    models: g.models || [{name: g.model || '', image: g.modelImage || g.image, rarity: 1}],
    prices: f.prices || [],
    floor: f.floor ?? null,
    tint: f.tint || TINTS[i % TINTS.length],
    backdrops: (DECOR[g.name] && DECOR[g.name].backdrops) || [],
    symbols: (DECOR[g.name] && DECOR[g.name].symbols) || [],
    index: i,
    hasPrice: f.floor != null
  };
});

const OFFER_LIMITS = {'Chill Flame':7, 'Big Year':3};
const OFFERS = GIFTS.flatMap((g, giftIndex) => {
  const models = g.models.length ? g.models : [{name: g.model || '', image: g.modelImage || g.image, rarity: 1}];
  const limit = OFFER_LIMITS[g.name] || Math.min(models.length, 7);
  const minRarity = Math.min(...models.map(m => Number(m.rarity) || 1));
  return models.slice(0, limit).map((m, offerIndex) => {
    const rarity = Number(m.rarity) || 1;
    const multiplier = 1 + offerIndex * 0.035 + Math.max(0, rarity - minRarity) * 0.05;
    const jitter = (((giftIndex + 12) * 13 + offerIndex * 7) % 23) * 0.01;
    return {
      ...g,
      giftIndex,
      offerIndex,
      model: m.name,
      modelImage: m.image,
      image: g.image,
      price: g.floor == null ? null : Math.round((g.floor * multiplier + jitter) * 100) / 100
    };
  });
});
OFFERS.forEach((o, i) => { o.index = i; });

const artOf = (g) => {
  const backs = g.backdrops || [];
  const syms = g.symbols || [];
  const gi = g.giftIndex ?? g.index ?? 0;
  const oi = g.offerIndex ?? 0;
  return {
    backdrop: backs.length ? backs[(gi * 5 + oi * 3) % backs.length] : null,
    symbol: syms.length ? syms[(gi * 7 + oi * 11) % syms.length] : null
  };
};
const artStyle = (g) => {
  const bd = artOf(g).backdrop;
  return bd
    ? `--c:${bd.center};--e:${bd.edge};--p:${bd.pattern};--t:${bd.text}`
    : `--c:${g.tint || '#899288'};--e:#0e1118;--p:${g.tint || '#1c261f'}`;
};
const symbolHTML = (g) => {
  const sym = artOf(g).symbol;
  return sym ? `<img class="art-symbol" src="${sym.image}" alt="" loading="lazy" onerror="this.style.display='none'">` : '';
};

const HOLDER = '@atlanta_holder';
const HOLDER_URL = 'https://t.me/atlanta_holder';

const url = (g, original = false) => original && g.useOriginal
  ? g.image
  : (g.modelImage || g.image || `https://cdn.changes.tg/gifts/models/${encodeURIComponent(g.name)}/png/${encodeURIComponent(g.model)}.png`);
const ton = (n) => n == null || n === '' ? '—' : Number(n).toLocaleString('ru-RU', {minimumFractionDigits:2, maximumFractionDigits:2});
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const tabbar = document.getElementById('tabbar');

  filter:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"/></svg>',

  heart:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 5.6a5.5 5.5 0 0 0-7.8 0L12 6.6l-1-1a5.5 5.5 0 0 0-7.8 7.8L12 22l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg>',
  hot:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s-3 2-3 5a7 7 0 0 0 14 0c0-6-7-11-7-11Z"/></svg>',
  gift:'<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M12 9v12M3 13h18M12 9S9 3 6.5 5.2 9 9 12 9Zm0 0s3-6 5.5-3.8S15 9 12 9Z"/></svg>',
  settings:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.08A1.7 1.7 0 0 0 9 19.36a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.64 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.08A1.7 1.7 0 0 0 4.64 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.64a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.08A1.7 1.7 0 0 0 15 4.64a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.36 9c.2.42.6.7 1.06.73H21a2 2 0 1 1 0 4h-.08a1.7 1.7 0 0 0-1.52 1.27Z"/></svg>'
};

const brandHead = () => `
  <div class="app-head">
    <div class="brand">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <defs><linearGradient id="mg" x1="10" y1="6" x2="38" y2="44" gradientUnits="userSpaceOnUse"><stop stop-color="#eaf3ff"/><stop offset=".45" stop-color="#8dbdff"/><stop offset="1" stop-color="#2f7dff"/></linearGradient></defs>
        <path d="M24 5 44 43h-9.4L24 22.8 13.4 43H4L24 5Z" fill="url(#mg)"/>
        <path d="M24 30.2 31.7 43H16.3L24 30.2Z" fill="#2f7dff" opacity=".9"/>
      </svg>
      <div>
        <div class="brand-name">ATLANTA</div>
        <div class="brand-sub">GIFT MARKET</div>
      </div>
    </div>
    <div class="head-actions">
      <button class="avatar" data-tab="profile" aria-label="Профиль">D</button>
    </div>
  </div>`;

const subHead = (title) => `
  <div class="app-head">
    <button class="back-btn" data-back aria-label="Назад">‹</button>
    <div class="brand">
      <div>
        <div class="brand-name" style="font-size:13px;letter-spacing:.04em">${esc(title)}</div>
        <div class="brand-sub">ATLANTA · GIFT MARKET</div>
      </div>
    </div>
  </div>`;

const searchRow = () => `
  <div class="search-row">
    <label class="search">${icons.search}<input id="q" type="text" value="${esc(state.query)}" placeholder="Найти подарок или модель" autocomplete="off"></label>
    <button class="filter-btn ${state.sort === 'default' ? '' : 'on'}" data-filter aria-label="Сортировка">${icons.filter}<span class="dot"></span></button>
  </div>`;

const SORT_LABELS = {
  default:'По порядку',
  priceAsc:'Сначала дешёвые',
  priceDesc:'Сначала дорогие',
  name:'По названию'
};

const matches = (g) => !state.query.trim() || (g.name + ' ' + (g.model || '')).toLowerCase().includes(state.query.trim().toLowerCase());

const priceOf = (g) => g.price ?? g.floor;

const sortItems = (items) => {
  if (state.sort === 'priceAsc') items.sort((a,b) => (priceOf(a) ?? Infinity) - (priceOf(b) ?? Infinity));
  if (state.sort === 'priceDesc') items.sort((a,b) => (priceOf(b) ?? -Infinity) - (priceOf(a) ?? -Infinity));
  if (state.sort === 'name') items.sort((a,b) => a.name.localeCompare(b.name, 'ru'));
  return items;
};

const filtered = () => sortItems(OFFERS.filter(matches));
const filteredGifts = () => sortItems(GIFTS.filter(matches));

const giftCard = (g) => `
  <button class="gift" data-offer="${g.index}">
    <div class="gift-art" style="${artStyle(g)}">
      ${symbolHTML(g)}
      <span class="fav" data-toast="Добавлено в избранное">${icons.heart}</span>
      <img class="model-img" src="${url(g)}" alt="${esc(g.name)}" loading="lazy"
           onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=&quot;img-fallback&quot;>ATLANTA</div>')">
    </div>
    <div class="gift-body">
      <div class="gift-name">${esc(g.name)}</div>
      <div class="gift-model">${esc(g.model || 'Коллекция')}</div>
      <div class="gift-price"><b>${ton(priceOf(g))} <span class="gram">GRAM</span></b></div>
    </div>
  </button>`;

const hero = () => `
  <section class="hero" style="${artStyle(GIFTS[0])}">
    <div class="hero-copy">
      <span class="hero-eyebrow"><i></i> Маркет подарков</span>
      <h1>Коллекционные <span>подарки</span> Telegram</h1>
      <p>Реальные цены коллекций и редкие модели.</p>
      <button class="hero-btn" data-toast="Открываем витрину">Смотреть витрину ${icons.arrow}</button>
    </div>
    <div class="hero-art">
      ${symbolHTML(GIFTS[0])}
      <img class="g1 model-img" src="${url(GIFTS[0], true)}" alt="">
      <img class="g2 model-img" src="${url(GIFTS[1], true)}" alt="">
      <img class="g3 model-img" src="${url(GIFTS[2], true)}" alt="">
    </div>

const collCard = (g) => `
  <button class="coll" data-gift="${g.index}">
    <div class="coll-art" style="${artStyle(g)}">
      ${symbolHTML(g)}
      <img class="model-img" src="${url(g, true)}" alt="${esc(g.name)}" loading="lazy">
    </div>
    <div class="coll-body">
      <b>${esc(g.name)}</b>
      <div class="coll-meta">
        <span class="coll-price"><small>от</small>${ton(g.floor)} <em class="gram">GRAM</em></span>
      </div>
    </div>
  </button>`;

const storeView = () => {
  const items = filtered();
  const collItems = filteredGifts();
  return `
    ${brandHead()}
    ${searchRow()}
    ${hero()}
    <div class="sec-head"><h2>Коллекции</h2><button class="link-btn" data-tab="collections">Открыть ${icons.arrow}</button></div>
    <div class="collections">
      ${collItems.slice(0,12).map(collCard).join('')}
    </div>
    <div class="sec-head"><h2>Витрина</h2><button class="link-btn" data-sort="priceAsc">По цене ${icons.arrow}</button></div>
    ${items.length ? `<div class="gift-grid">${items.map(giftCard).join('')}</div>` : `
      <div class="empty">
        <div class="ring">${icons.search}</div>
        <b>Ничего не нашлось</b>
        <p>Попробуйте другой запрос или сбросьте сортировку.</p>
      </div>`}`;
};

const collectionsView = () => `
  ${brandHead()}
  ${searchRow()}
  <div class="sec-head" style="margin-top:2px"><h2>Коллекции</h2><button class="link-btn" data-sort="priceAsc">По цене ${icons.arrow}</button></div>
  <div class="coll-grid">
    ${filteredGifts().map(collCard).join('')}
  </div>`;

const addGiftCard = () => `
  <section class="add-gift">
    <div class="ag-ico">${icons.gift}</div>
    <div>
      <b>Есть подарки в Telegram?</b>
      <p>Добавьте их через нашего бота — они появятся в инвентаре.</p>
    </div>
    <button class="add-gift-btn" data-how>Как добавить?</button>
  </section>`;

const inventoryView = () => `
  ${brandHead()}
  <div class="sec-head" style="margin-top:2px"><h2>Мои подарки <span class="count">0</span></h2></div>
  ${addGiftCard()}
  <div class="empty">
    <div class="ring">${icons.hot}</div>
    <b>Инвентарь пока пуст</b>
    <p>Добавьте подарок через бота — он появится здесь и станет частью коллекции.</p>
    <button class="hero-btn" style="margin-top:4px" data-tab-jump="store">Перейти в маркет ${icons.arrow}</button>
  </div>
  <div class="sec-head" style="margin-top:6px"><h2>История</h2><button class="link-btn" data-screen="history">Открыть ${icons.arrow}</button></div>
  <div class="empty" style="padding:26px 20px">
    <div class="ring">${icons.heart}</div>

`;

const profileView = () => `
  ${brandHead()}
  <div class="profile-card">

      <div class="profile-avatar">D</div>
      <div>
        <b>Даниил</b>
        <small>@daeeeeer</small>

      <div class="stat"><b>0</b><span>Подарков</span></div>

    </div>
  </div>
  <div class="menu">
    <button class="menu-row" data-topup><span class="mi">${icons.filter}</span>Пополнить счёт<span class="arrow">›</span></button>
    <button class="menu-row" data-screen="history"><span class="mi">${icons.hot}</span>История пополнений<span class="arrow">›</span></button>
    <button class="menu-row" data-screen="settings"><span class="mi">${icons.settings}</span>Настройки<span class="arrow">›</span></button>
  </div>
`;

const historyView = () => `
  ${subHead('История пополнений')}
  <div class="empty">
    <div class="ring">${icons.hot}</div>
    <b>Пополнений пока нет</b>
    <p>Здесь появятся отправленные подарки и пополнения GRAM.</p>
    <button class="hero-btn" style="margin-top:4px" data-topup>Пополнить счёт ${icons.arrow}</button>
  </div>
`;

const settingsView = () => `
  ${subHead('Настройки')}
  <div class="menu">
    <button class="menu-row" data-toggle="notifications"><span class="mi">${icons.hot}</span>Уведомления<span class="val">${state.notifications ? 'Включены' : 'Выключены'}</span></button>
    <button class="menu-row" data-toggle="compact"><span class="mi">${icons.settings}</span>Компактный вид<span class="val">${state.compact ? 'Вкл' : 'Выкл'}</span></button>
    <button class="menu-row" data-screen="history"><span class="mi">${icons.filter}</span>История пополнений<span class="arrow">›</span></button>
    <button class="menu-row" data-how><span class="mi">${icons.gift}</span>Как добавить подарки<span class="arrow">›</span></button>
  </div>
`;

function render(){
  const screens = { store:storeView, collections:collectionsView, inventory:inventoryView, profile:profileView, history:historyView, settings:settingsView };
  view.innerHTML = (screens[state.screen] || screens[state.tab] || storeView)();
  view.scrollTop = 0;
  document.body.classList.toggle('compact', state.compact);
  const activeTab = state.screen ? 'profile' : state.tab;
  [...tabbar.children].forEach(b => b.classList.toggle('on', b.dataset.tab === activeTab));
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 1800);
}

function openSheet(index, collectionOnly = false){
  const g = collectionOnly ? GIFTS[index] : OFFERS[index];
  if (!g) return;
  const sheet = document.getElementById('sheet');
  const decor = artOf(g);
  sheet.style.setProperty('--glow', g.tint);
  sheet.innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <div><h3>${esc(g.name)}</h3><small>${collectionOnly ? 'Коллекция' : esc(g.model || 'Модель')}</small></div>
      <button class="sheet-close" data-close>✕</button>
    </div>
    <div class="sheet-art" style="${artStyle(g)}">
      ${symbolHTML(g)}
      <img class="model-img" src="${url(g, collectionOnly)}" alt="${esc(g.name)}"
           onerror="this.style.display='none';this.parentNode.insertAdjacentHTML('beforeend','<div class=&quot;img-fallback&quot;>ATLANTA</div>')">
    </div>
    <div class="sheet-rows">
      <div class="sheet-row"><span>Цена</span><b>${ton(priceOf(g))} <span class="gram">GRAM</span></b></div>
      ${collectionOnly ? '' : `<div class="sheet-row"><span>Модель</span><b>${esc(g.model || 'Модель')}</b></div>`}
      ${decor.backdrop ? `<div class="sheet-row"><span>Фон</span><b>${esc(decor.backdrop.name)}</b></div>` : ''}
      ${!collectionOnly && decor.symbol ? `<div class="sheet-row"><span>Символ</span><b>${esc(decor.symbol.name)}</b></div>` : ''}
    </div>
    <button class="sheet-link" data-topup>Пополнить счёт</button>`;
  document.getElementById('sheetBack').classList.add('open');
}

function openTopupSheet(){
  const sheet = document.getElementById('sheet');
  sheet.style.setProperty('--glow', '#3d8bff');
  sheet.innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <div><h3>Пополнение недоступно</h3><small>временные сложности</small></div>
      <button class="sheet-close" data-close>✕</button>
    </div>
    <div class="sheet-msg">На стороне сервиса приёма платежей сейчас неполадки. Попробуйте позже.</div>
    <button class="buy-btn" data-close>Понятно</button>`;
  document.getElementById('sheetBack').classList.add('open');
}

function openHowSheet(){
  const sheet = document.getElementById('sheet');
  sheet.style.setProperty('--glow', '#3d8bff');
  sheet.innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <div><h3>Как добавить подарки</h3><small>через нашего бота</small></div>
      <button class="sheet-close" data-close>✕</button>
    </div>
    <div class="how-steps">
      <div class="how-step"><b>1</b><span>Откройте бота ${HOLDER}.</span></div>
      <div class="how-step"><b>2</b><span>Передайте боту все подарки, которые хотите закинуть на маркет.</span></div>
      <div class="how-step"><b>3</b><span>После обработки они появятся в вашем инвентаре ATLANTA.</span></div>
    </div>
    <button class="buy-btn" data-holder>Открыть бота ${icons.arrow}</button>`;
  document.getElementById('sheetBack').classList.add('open');
}

function openFilterSheet(){
  const sheet = document.getElementById('sheet');
  sheet.style.setProperty('--glow', '#3d8bff');
  sheet.innerHTML = `
    <div class="sheet-grab"></div>
    <div class="sheet-top">
      <div><h3>Сортировка</h3><small>выберите порядок витрины</small></div>
      <button class="sheet-close" data-close>✕</button>
    </div>
    <div class="filter-options">
      ${Object.entries(SORT_LABELS).map(([k,l]) => `
        <button class="filter-option ${state.sort === k ? 'on' : ''}" data-sort="${k}">
          <span>${l}</span><i></i>
        </button>`).join('')}
    </div>
    <button class="buy-btn" data-close>Готово</button>`;
  document.getElementById('sheetBack').classList.add('open');
}

function closeSheet(){ document.getElementById('sheetBack').classList.remove('open'); }

document.addEventListener('click', (e) => {
  const back = e.target.closest('[data-back]');
  if (back){ state.screen = null; render(); return; }
  const screen = e.target.closest('[data-screen]');
  if (screen){ state.screen = screen.dataset.screen; render(); return; }
  const toggle = e.target.closest('[data-toggle]');
  if (toggle){
    state[toggle.dataset.toggle] = !state[toggle.dataset.toggle];
    render();
    toast(toggle.dataset.toggle === 'notifications'
      ? (state.notifications ? 'Уведомления включены' : 'Уведомления выключены')
      : (state.compact ? 'Компактный вид включён' : 'Компактный вид выключен'));
    return;
  }
  const tab = e.target.closest('[data-tab]');
  if (tab){ state.tab = tab.dataset.tab; state.screen = null; render(); return; }
  const jump = e.target.closest('[data-tab-jump]');
  if (jump){ state.tab = jump.dataset.tabJump; render(); return; }
  const filterBtn = e.target.closest('[data-filter]');
  if (filterBtn){ openFilterSheet(); return; }
  const sort = e.target.closest('[data-sort]');
  if (sort){
    state.sort = sort.dataset.sort;
    closeSheet();
    render();
    toast('Сортировка: ' + SORT_LABELS[state.sort]);
    return;
  }
  const fav = e.target.closest('.fav');
  if (fav){ e.preventDefault(); e.stopPropagation(); toast('Добавлено в избранное'); return; }
  const offer = e.target.closest('[data-offer]');
  if (offer){ openSheet(Number(offer.dataset.offer)); return; }
  const gift = e.target.closest('[data-gift]');
  if (gift){ openSheet(Number(gift.dataset.gift), true); return; }
  const holder = e.target.closest('[data-holder]');
  if (holder){ window.open(HOLDER_URL, '_blank', 'noopener'); toast('Открываем '+HOLDER); return; }
  const how = e.target.closest('[data-how]');
  if (how){ openHowSheet(); return; }
  const topup = e.target.closest('[data-topup]');
  if (topup){ openTopupSheet(); return; }
  const t = e.target.closest('[data-toast]');
  if (t && !t.closest('[data-gift]') && !t.closest('[data-offer]')){ toast(t.dataset.toast); return; }
  if (e.target.closest('[data-close]') || e.target.id === 'sheetBack'){ closeSheet(); return; }
});

document.addEventListener('input', (e) => {
  if (e.target.id !== 'q') return;
  state.query = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const input = document.getElementById('q');
  if (input){ input.focus(); input.setSelectionRange(caret, caret); }
});

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });

render();
</script>
</body>
</html>
